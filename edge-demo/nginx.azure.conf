server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 128k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'" always;

    # Content-free probe used by Azure Front Door. Authentication configuration may
    # exempt only this exact route. No identity, version, build, or service metadata
    # is returned here.
    location = /afd-healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The only dynamic browser route in the hosted demo. All privileged Edge API
    # credentials remain in the adjacent BFF container and never reach Nginx/browser.
    location ^~ /edge/ui/v1/ {
        proxy_pass http://127.0.0.1:8001$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Server;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # Fail closed on every legacy/raw service path. Hosted Edge Virtual is not an
    # Internet-accessible development API, proxy, Swagger surface, or device admin port.
    location ~ ^/(api|docs|redoc|openapi\.json|edge/v1|internal|health|ready|version|evidence|proof|proofs|verify|reports|log|anchors|tree-head)(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
