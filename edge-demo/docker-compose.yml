services:
  edge-api:
    build:
      context: ..
      dockerfile: edge-demo/Dockerfile.api
    environment:
      ETS_EDGE_DATA_DIR: /var/lib/ets
      ETS_STORAGE_PROVIDER: sqlite
      ETS_SQLITE_PATH: /var/lib/ets/edge.db
      ETS_LOG_ID: ets-edge-virtual-demo
      ETS_REDACTION_PROFILE: none
      ETS_AUTH_MODE: local_api_key
      ETS_SIGNING_MODE: ed25519
      ETS_SIGNING_PUBLIC_KEY_ID: ets-edge-virtual-demo-key
    volumes:
      - ets-edge-data:/var/lib/ets
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  edge-webhook:
    build:
      context: ..
      dockerfile: edge-demo/Dockerfile.webhook
    environment:
      ETS_EDGE_API_URL: http://edge-api:8000
      ETS_EDGE_API_KEY_FILE: /var/lib/ets/edge-local-api-key
      ETS_EDGE_DEVICE_IDENTITY_FILE: /var/lib/ets/edge-device-identity.json
      ETS_EDGE_SYNC_DB: /var/lib/ets/edge-sync.db
      ETS_EDGE_SYNC_MAX_ITEMS: "1000"
      ETS_EDGE_SYNC_MAX_BYTES: "67108864"
      ETS_EDGE_UPSTREAM_URL: http://edge-upstream:8002
      ETS_EDGE_SYSLOG_ENABLED: "1"
      ETS_EDGE_SYSLOG_HOST: 0.0.0.0
      ETS_EDGE_SYSLOG_PORT: "5514"
      ETS_EDGE_SYSLOG_TENANT: tenant_demo
      ETS_EDGE_SYSLOG_WORKSPACE: workspace_alpha
      ETS_EDGE_SYSLOG_SOURCE_ID: syslog-demo
    volumes:
      - ets-edge-data:/var/lib/ets
    depends_on:
      edge-api:
        condition: service_healthy
    ports:
      - "5514:5514/udp"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  edge-upstream:
    build:
      context: ..
      dockerfile: edge-demo/Dockerfile.upstream
    environment:
      ETS_EDGE_UPSTREAM_DB: /var/lib/ets-upstream/upstream.db
    volumes:
      - ets-edge-upstream:/var/lib/ets-upstream
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  edge-ui:
    build:
      context: ..
      dockerfile: edge-demo/Dockerfile.ui
      args:
        VITE_ETS_API_BASE_URL: ""
    depends_on:
      edge-api:
        condition: service_healthy
      edge-webhook:
        condition: service_healthy
    ports:
      - "8400:80"
    restart: unless-stopped

volumes:
  ets-edge-data:
  ets-edge-upstream:
