resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'" always;

    set $edge_webhook http://edge-webhook:8001;
    set $edge_upstream http://edge-upstream:8002;
    set $edge_api http://edge-api:8000;

    # Browser-safe Dark Pro BFF. The browser never receives the Edge local API key.
    location ^~ /edge/ui/v1/ {
        proxy_pass $edge_webhook$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Server;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # Protected lab/operator routes remain available only through the host-loopback
    # port published by docker-compose and still require X-ETS-API-Key.
    location ^~ /edge/v1/capture/ {
        proxy_pass $edge_webhook$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /edge/v1/syslog/ {
        proxy_pass $edge_webhook$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /edge/v1/sync/ {
        proxy_pass $edge_webhook$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /edge/v1/device/identity {
        proxy_pass $edge_webhook$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /edge/v1/upstream/ {
        proxy_pass $edge_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(health|healthz|ready|version|openapi\.json|docs|redoc|api/|evidence|proof|proofs|verify|reports|log|anchors|tree-head) {
        proxy_pass $edge_api$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
