name: Apalache Symbolic Verification

on:
  workflow_dispatch:
  pull_request:

jobs:
  symbolic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Apalache
        run: |
          mkdir -p tools
          cd tools
          curl -L -o apalache.tgz https://github.com/informalsystems/apalache/releases/download/v0.40.7/apalache.tgz
          tar -xzf apalache.tgz

      - name: Validate symbolic target manifest
        run: |
          test -f formal/apalache/model-targets.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("formal/apalache/model-targets.json")
          with manifest.open("r", encoding="utf-8") as stream:
              json.load(stream)
          PY
          test -f scripts/run-apalache-models.sh

      - name: Execute symbolic evidence capture
        env:
          APALACHE_OUTPUT_DIR: artifacts/proofs
        run: bash scripts/run-apalache-models.sh

      - name: Upload symbolic proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbolic-proof-artifacts
          path: artifacts/proofs/
          if-no-files-found: warn
