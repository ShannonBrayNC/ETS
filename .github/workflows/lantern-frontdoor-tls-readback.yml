name: Read Lantern Front Door TLS State

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lantern-frontdoor-tls-readback.yml'

permissions:
  contents: read
  id-token: write

jobs:
  state:
    name: Read custom domain validation token
    runs-on: ubuntu-latest
    environment: ets-azure-q1
    timeout-minutes: 8
    env:
      RESOURCE_GROUP: rg-ets-live-eastus
      PROFILE_NAME: lantern-continuity-fd
      CUSTOM_DOMAIN_NAME: azure-lanternprotocol-net
    steps:
      - name: Azure login with ETS workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Front Door CLI extension
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name cdn --upgrade --yes --only-show-errors

      - name: Read validation token and state
        shell: bash
        run: |
          set -euo pipefail
          az afd custom-domain show \
            -g "$RESOURCE_GROUP" \
            --profile-name "$PROFILE_NAME" \
            --custom-domain-name "$CUSTOM_DOMAIN_NAME" \
            --query '{host:hostName,validation:domainValidationState,deployment:deploymentStatus,certificate:tlsSettings.certificateType,minimumTls:tlsSettings.minimumTlsVersion,validationToken:validationProperties.validationToken,validationExpiry:validationProperties.expirationDate}' \
            -o json
