name: Provision Lantern Azure Front Door Standby

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lantern-frontdoor-standby.yml'

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: lantern-frontdoor-standby
  cancel-in-progress: true

jobs:
  provision:
    name: Provision Front Door and publish DNS target
    runs-on: ubuntu-latest
    environment: ets-azure-q1
    timeout-minutes: 20
    env:
      RESOURCE_GROUP: rg-ets-live-eastus
      CUSTOM_HOST: azure.lanternprotocol.net
      PROFILE_NAME: lantern-continuity-fd
      ORIGIN_GROUP_NAME: lantern-static-site
      ORIGIN_NAME: lantern-storage-origin
      ROUTE_NAME: lantern-site-route
      EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Azure login with ETS workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Front Door CLI extension
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name cdn --upgrade --yes --only-show-errors

      - name: Validate EchoMedia boundary and resolve continuity origin
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          active_subscription="$(az account show --query id -o tsv)"
          active_tenant="$(az account show --query tenantId -o tsv)"
          test "${active_subscription,,}" = "${EXPECTED_SUBSCRIPTION_ID,,}"
          test "${active_tenant,,}" = "${EXPECTED_TENANT_ID,,}"
          location="$(az group show --name "$RESOURCE_GROUP" --query location -o tsv)"
          test "$location" = "eastus"

          mapfile -t storage_accounts < <(az storage account list --resource-group "$RESOURCE_GROUP" --query "[?tags.workload=='lantern-site'].name" -o tsv)
          test "${#storage_accounts[@]}" -eq 1
          storage="${storage_accounts[0]}"
          origin_url="$(az storage account show --name "$storage" --resource-group "$RESOURCE_GROUP" --query primaryEndpoints.web -o tsv)"
          test -n "$origin_url"
          origin_host="${origin_url#https://}"
          origin_host="${origin_host%/}"
          suffix="$(printf '%s' "${EXPECTED_SUBSCRIPTION_ID}:${RESOURCE_GROUP}:lantern-frontdoor" | sha256sum | cut -c1-10)"
          endpoint_name="lantern-azure-${suffix}"

          echo "storage=$storage" >> "$GITHUB_OUTPUT"
          echo "origin_host=$origin_host" >> "$GITHUB_OUTPUT"
          echo "endpoint_name=$endpoint_name" >> "$GITHUB_OUTPUT"

      - name: Create or converge Front Door Standard resources
        id: converge
        shell: bash
        env:
          ENDPOINT_NAME: ${{ steps.boundary.outputs.endpoint_name }}
          ORIGIN_HOST: ${{ steps.boundary.outputs.origin_host }}
        run: |
          set -euo pipefail
          if ! az afd profile show -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" >/dev/null 2>&1; then
            az afd profile create -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --sku Standard_AzureFrontDoor --tags workload=lantern-site purpose=business-continuity owner=echomedia --output none
          fi

          if ! az afd endpoint show -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --endpoint-name "$ENDPOINT_NAME" >/dev/null 2>&1; then
            az afd endpoint create -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --endpoint-name "$ENDPOINT_NAME" --enabled-state Enabled --tags workload=lantern-site purpose=business-continuity --output none
          fi

          if ! az afd origin-group show -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --origin-group-name "$ORIGIN_GROUP_NAME" >/dev/null 2>&1; then
            az afd origin-group create -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --origin-group-name "$ORIGIN_GROUP_NAME" --probe-request-type GET --probe-protocol Https --probe-interval-in-seconds 60 --probe-path / --sample-size 4 --successful-samples-required 3 --additional-latency-in-milliseconds 50 --output none
          fi

          if az afd origin show -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --origin-group-name "$ORIGIN_GROUP_NAME" --origin-name "$ORIGIN_NAME" >/dev/null 2>&1; then
            az afd origin update -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --origin-group-name "$ORIGIN_GROUP_NAME" --origin-name "$ORIGIN_NAME" --host-name "$ORIGIN_HOST" --origin-host-header "$ORIGIN_HOST" --priority 1 --weight 1000 --enabled-state Enabled --http-port 80 --https-port 443 --output none
          else
            az afd origin create -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --origin-group-name "$ORIGIN_GROUP_NAME" --origin-name "$ORIGIN_NAME" --host-name "$ORIGIN_HOST" --origin-host-header "$ORIGIN_HOST" --priority 1 --weight 1000 --enabled-state Enabled --http-port 80 --https-port 443 --output none
          fi

          if az afd route show -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --endpoint-name "$ENDPOINT_NAME" --route-name "$ROUTE_NAME" >/dev/null 2>&1; then
            az afd route update -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --endpoint-name "$ENDPOINT_NAME" --route-name "$ROUTE_NAME" --origin-group "$ORIGIN_GROUP_NAME" --enabled-state Enabled --forwarding-protocol HttpsOnly --https-redirect Enabled --link-to-default-domain Enabled --patterns-to-match '/*' --supported-protocols Http Https --output none
          else
            az afd route create -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --endpoint-name "$ENDPOINT_NAME" --route-name "$ROUTE_NAME" --origin-group "$ORIGIN_GROUP_NAME" --enabled-state Enabled --forwarding-protocol HttpsOnly --https-redirect Enabled --link-to-default-domain Enabled --patterns-to-match '/*' --supported-protocols Http Https --output none
          fi

      - name: Verify Front Door default endpoint
        id: default_endpoint
        shell: bash
        env:
          ENDPOINT_NAME: ${{ steps.boundary.outputs.endpoint_name }}
        run: |
          set -euo pipefail
          afd_host="$(az afd endpoint show -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --endpoint-name "$ENDPOINT_NAME" --query hostName -o tsv)"
          test -n "$afd_host"
          echo "afd_host=$afd_host" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 24); do
            if body="$(curl --fail --silent --show-error --max-time 15 "https://$afd_host/")"; then
              printf '%s' "$body" | grep -Fq 'Evidence you can prove.'
              printf '%s' "$body" | grep -Fq 'ETS TECHNICAL BRIEFING'
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Publish DNS handoff evidence
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AFD_HOST: ${{ steps.default_endpoint.outputs.afd_host }}
          STORAGE_ACCOUNT: ${{ steps.boundary.outputs.storage }}
          CONVERGE_OUTCOME: ${{ steps.converge.outcome }}
          DEFAULT_ENDPOINT_OUTCOME: ${{ steps.default_endpoint.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          title = 'Lantern Azure Front Door standby'
          afd_host = os.environ.get('AFD_HOST', '').strip()
          ready = os.environ.get('DEFAULT_ENDPOINT_OUTCOME') == 'success' and bool(afd_host)
          status = 'READY_FOR_DNS' if ready else 'FAILED'
          body = f'''# Lantern Protocol Azure Front Door standby

**Status:** {status}

- Requested hostname: `azure.lanternprotocol.net`
- DNS record type: `CNAME`
- DNS host/name: `azure`
- DNS target/value: `{afd_host or '(not available)'}`
- Recommended TTL during verification: `300` seconds
- Front Door profile: `{os.environ['PROFILE_NAME']}`
- Resource group: `{os.environ['RESOURCE_GROUP']}`
- Storage origin: `{os.environ.get('STORAGE_ACCOUNT') or '(not available)'}`
- Front Door convergence: `{os.environ.get('CONVERGE_OUTCOME', 'unknown')}`
- Default Front Door endpoint verification: `{os.environ.get('DEFAULT_ENDPOINT_OUTCOME', 'unknown')}`
- Custom domain/certificate activation: `not started until DNS CNAME is present`
- Source commit: `{os.environ['GITHUB_SHA']}`
- Recorded: `{datetime.now(timezone.utc).isoformat()}`

`READY_FOR_DNS` means the Azure Front Door default endpoint is serving the verified Lantern continuity site. The next gate is to add the `azure` CNAME, then run the separate custom-domain activation workflow. The production apex `lanternprotocol.net` remains unchanged.
'''
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'lantern-frontdoor-standby',
          }
          def request(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          query = urllib.parse.urlencode({'q': f'repo:{repo} is:issue in:title "{title}"'})
          found = request(f'https://api.github.com/search/issues?{query}')
          issue = next((item for item in found.get('items', []) if item.get('title') == title), None)
          if issue:
              request(f"https://api.github.com/repos/{repo}/issues/{issue['number']}", 'PATCH', {'body': body, 'state': 'open'})
          else:
              request(f'https://api.github.com/repos/{repo}/issues', 'POST', {'title': title, 'body': body})
          PY
