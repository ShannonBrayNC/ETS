name: Fleet C3E PowerShell

on:
  pull_request:
    paths:
      - "scripts/azure/ensure-fleet-entra-application.ps1"
      - "scripts/azure/ensure-fleet-entra-application-device-auth.ps1"
      - "tests/architecture/test_fleet_c3e_entra_bootstrap.py"
      - "tests/architecture/test_fleet_c3e_device_auth_recovery.py"
      - "docs/fleet/ETS_FLEET_C3E_ENTRA_BOOTSTRAP.md"
      - "docs/fleet/ETS_FLEET_C3E_DEVICE_AUTH_RECOVERY.md"
      - ".github/workflows/fleet-c3e-powershell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    name: Parse delegated Fleet Entra bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell without executing Graph or Azure operations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
              'scripts/azure/ensure-fleet-entra-application.ps1',
              'scripts/azure/ensure-fleet-entra-application-device-auth.ps1'
          )
          foreach ($path in $paths) {
              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $path,
                  [ref]$tokens,
                  [ref]$parseErrors
              )
              if ($parseErrors.Count -ne 0) {
                  $parseErrors | ForEach-Object { Write-Error $_.Message }
                  throw "Fleet C3E PowerShell contains parse errors: $path"
              }
              if ($tokens.Count -eq 0) {
                  throw "Fleet C3E PowerShell parsed to an empty token stream: $path"
              }
              Write-Host "Parsed $path with $($tokens.Count) tokens and zero parse errors."
          }
