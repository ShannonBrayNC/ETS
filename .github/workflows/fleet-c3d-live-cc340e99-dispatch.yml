name: Fleet C3D Exact-Source API Dispatch

on:
  push:
    branches:
      - qualification/fleet-c3d-live-cc340e99
    paths:
      - .github/workflows/fleet-c3d-live-cc340e99-dispatch.yml

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch C3D from exact qualified Q0 image
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: cc340e99d8d95347557949e937e6ed2dc47d2746
          IMMUTABLE_IMAGE: etsq1a352eb89.azurecr.io/ets/fleet/control-plane@sha256:9f449e81b6c87becadb7433d735b52f2500ce799913c448605b28eea15c8f62b
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_SOURCE_SHA"
          cat > /tmp/dispatch.json <<EOF
          {
            "ref": "main",
            "inputs": {
              "expected_source_sha": "$EXPECTED_SOURCE_SHA",
              "fleet_image": "$IMMUTABLE_IMAGE",
              "resource_group": "rg-ets-live-eastus",
              "container_registry_name": "etsq1a352eb89",
              "container_registry_resource_group": "rg-ets-q1-eastus",
              "entra_application_display_name": "ETS Fleet Control Plane",
              "provision_entra_application": "true",
              "step_up_auth_context_id": "c1",
              "postgres_high_availability_mode": "ZoneRedundant"
            }
          }
          EOF
          if gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/fleet-c3d-live-deploy.yml/dispatches" \
            --input /tmp/dispatch.json >/tmp/dispatch.out 2>/tmp/dispatch.err; then
            cat > /tmp/comment.md <<EOF
          ### Fleet C3D API dispatch accepted

          Source SHA: \`$EXPECTED_SOURCE_SHA\`
          Immutable image: \`$IMMUTABLE_IMAGE\`
          GitHub accepted the protected C3D workflow dispatch. The custom Fleet hostname remains unactivated.
          EOF
            gh issue comment 528 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          else
            sed -E 's/(token|secret|password|authorization)[^ ]*/[REDACTED]/Ig' /tmp/dispatch.err > /tmp/safe.err
            {
              echo '### Fleet C3D API dispatch rejected'
              echo
              echo '```text'
              head -c 6000 /tmp/safe.err
              echo
              echo '```'
              echo
              echo 'No C3D workflow run was created by this rejected dispatch.'
            } > /tmp/comment.md
            gh issue comment 528 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
            exit 1
          fi
