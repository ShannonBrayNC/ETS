name: Fleet C3C Q0 Readback V2 6b852b50

on:
  push:
    branches:
      - qualification/fleet-c3c-q0-6b852b50
    paths:
      - .github/workflows/fleet-c3c-q0-readback-v2-6b852b50.yml

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: 6b852b50da511df659f27c0d0f81c41c9f8d25c8
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve exact-source successful Fleet Q0 run
        id: run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/fleet-c3c-q0-readback-v2
          gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow fleet-c3c-q0-image.yml \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId,headSha,headBranch,status,conclusion \
            > "${RUNNER_TEMP}/runs.json"
          RUNS="$(cat "${RUNNER_TEMP}/runs.json")" python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ['EXPECTED_SOURCE_SHA']
          runs = json.loads(os.environ['RUNS'])
          matches = [
              item for item in runs
              if item.get('headSha') == expected and item.get('headBranch') == 'main'
          ]
          matches.sort(key=lambda item: int(item['databaseId']), reverse=True)
          if not matches:
              raise SystemExit('no exact-source Fleet Q0 workflow_dispatch run found')
          run = matches[0]
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit(
                  f"exact-source Fleet Q0 is not successful: {run.get('status')}/{run.get('conclusion')}"
              )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"run_id={run['databaseId']}\n")
          print(json.dumps(run, indent=2, sort_keys=True))
          PY

      - name: Download and validate retained Fleet Q0 manifest
        id: validate
        shell: bash
        env:
          Q0_RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          artifact_name="fleet-c3c-q0-image-${Q0_RUN_ID}"
          rm -rf "${RUNNER_TEMP}/q0"
          mkdir -p "${RUNNER_TEMP}/q0"
          gh run download "$Q0_RUN_ID" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "$artifact_name" \
            --dir "${RUNNER_TEMP}/q0"
          Q0_RUN_ID="$Q0_RUN_ID" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'], 'q0')
          candidates = list(root.rglob('manifest.json'))
          if len(candidates) != 1:
              raise SystemExit('Fleet Q0 manifest is missing or ambiguous')
          manifest = json.loads(candidates[0].read_text(encoding='utf-8'))
          expected = os.environ['EXPECTED_SOURCE_SHA']
          run_id = os.environ['Q0_RUN_ID']
          subject = 'etsq1a352eb89.azurecr.io/ets/fleet/control-plane'
          digest = manifest.get('image_digest')
          immutable = manifest.get('immutable_image')
          checks = (
              manifest.get('schema_version') == 'ets.fleet.c3c.q0_image.v1',
              manifest.get('source_sha') == expected,
              str(manifest.get('workflow_run_id')) == run_id,
              manifest.get('vulnerability_gate') == 'PASS',
              manifest.get('registry_credentials_retained') is False,
              manifest.get('customer_identifiers_retained') is False,
              isinstance(digest, str) and re.fullmatch(r'sha256:[0-9a-f]{64}', digest) is not None,
              isinstance(digest, str) and immutable == f'{subject}@{digest}',
          )
          if not all(checks):
              raise SystemExit('Fleet Q0 retained manifest failed validation')
          result = {
              'schema_version': 'ets.fleet.c3c.q0_readback.v2',
              'classification': 'fleet_q0_exact_source_qualified',
              'qualified': True,
              'source_sha': expected,
              'q0_workflow_run_id': int(run_id),
              'immutable_image': immutable,
              'image_digest': digest,
              'vulnerability_gate': 'PASS',
              'registry_credentials_retained': False,
              'customer_identifiers_retained': False,
          }
          out = Path('evidence/fleet-c3c-q0-readback-v2/result.json')
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"immutable_image={immutable}\n")
          PY

      - name: Post exact qualified Q0 handoff to FLEET-C3 parent
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          result = json.loads(Path('evidence/fleet-c3c-q0-readback-v2/result.json').read_text())
          body = (
              '### Fleet C3C Q0 exact-source qualification\n\n'
              f"Readback run: {os.environ['RUN_URL']}\n\n"
              '```json\n' + json.dumps(result, indent=2, sort_keys=True) + '\n```\n\n'
              'The immutable image is now eligible as the C3D deployment input. No Azure mutation was performed by this readback.'
          )
          req = Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/521/comments",
              data=json.dumps({'body': body}).encode('utf-8'),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2026-03-10',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urlopen(req, timeout=30.0) as response:
              if response.status != 201:
                  raise RuntimeError(f'issue comment returned HTTP {response.status}')
          PY

      - name: Retain sanitized Q0 readback
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fleet-c3c-q0-readback-v2-${{ github.run_id }}
          path: evidence/fleet-c3c-q0-readback-v2/
          if-no-files-found: error
          retention-days: 90
