name: Deploy Lantern Protocol Azure Backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/lantern-site-backup/site/**'
      - '.github/workflows/lantern-site-backup-deploy.yml'

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: lantern-site-backup-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static continuity site
    runs-on: ubuntu-latest
    environment: ets-azure-q1
    timeout-minutes: 20
    env:
      RESOURCE_GROUP: rg-ets-live-eastus
      SITE_SOURCE: ops/lantern-site-backup/site
      EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Azure login with existing ETS workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate live EchoMedia deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          active_subscription="$(az account show --query id -o tsv)"
          active_tenant="$(az account show --query tenantId -o tsv)"
          test "${active_subscription,,}" = "${EXPECTED_SUBSCRIPTION_ID,,}"
          test "${active_tenant,,}" = "${EXPECTED_TENANT_ID,,}"
          location="$(az group show --name "$RESOURCE_GROUP" --query location -o tsv)"
          test "$location" = "eastus"
          test -f "$SITE_SOURCE/index.html"
          test -f "$SITE_SOURCE/styles.css"

      - name: Resolve existing isolated static-site storage
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          suffix="$(printf '%s' "${EXPECTED_SUBSCRIPTION_ID}:${RESOURCE_GROUP}:lantern" | sha256sum | cut -c1-13)"
          storage="lanternbkp${suffix}"
          az storage account show --name "$storage" --resource-group "$RESOURCE_GROUP" --output none
          endpoint="$(az storage account show --name "$storage" --resource-group "$RESOURCE_GROUP" --query primaryEndpoints.web -o tsv)"
          test -n "$endpoint"
          echo "storage=$storage" >> "$GITHUB_OUTPUT"
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"

      - name: Publish captured continuity copy with Entra data-plane auth
        id: publish
        shell: bash
        env:
          STORAGE_ACCOUNT: ${{ steps.storage.outputs.storage }}
          ENDPOINT: ${{ steps.storage.outputs.endpoint }}
        run: |
          set -euo pipefail
          az storage blob delete-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login \
            --source '$web' \
            --output none || true
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login \
            --destination '$web' \
            --source "$SITE_SOURCE" \
            --overwrite true \
            --output none
          test -n "$ENDPOINT"
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Verify public backup endpoint
        id: verify
        shell: bash
        env:
          ENDPOINT: ${{ steps.publish.outputs.endpoint }}
        run: |
          set -euo pipefail
          test -n "$ENDPOINT"
          for attempt in $(seq 1 12); do
            if body="$(curl --fail --silent --show-error --max-time 10 "$ENDPOINT")" \
              && app="$(curl --fail --silent --show-error --max-time 10 "${ENDPOINT}app.js")"; then
              printf '%s' "$body" | grep -Fq 'Evidence you can prove.'
              printf '%s' "$body" | grep -Fq 'ETS TECHNICAL BRIEFING'
              printf '%s' "$body" | grep -Fq 'shannon.bray@echomedia.ai'
              printf '%s' "$body" | grep -Fq 'shannonbraync@outlook.com'
              printf '%s' "$app" | grep -Fq 'M365 Connector'
              printf '%s' "$app" | grep -Fq 'Provenance'
              printf '%s' "$app" | grep -Fq 'AI WITNESS'
              printf '%s' "$app" | grep -Fq 'THE COMPLETE ETS PLATFORM'
              break
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 5
          done
          {
            echo '## Lantern Protocol Azure backup'
            echo
            echo "- Endpoint: $ENDPOINT"
            echo "- Resource group: $RESOURCE_GROUP"
            echo "- Storage account: ${{ steps.storage.outputs.storage }}"
            echo '- M365 Connector, Provenance, and the complete ETS platform showcase were verified in the public endpoint assets.'
            echo '- Primary ETS Core/Gateway resources were not modified.'
            echo '- Contact and early-access forms route through the visitor email client to the designated Lantern addresses.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish deployment evidence to GitHub issue
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STORAGE_OUTCOME: ${{ steps.storage.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          STORAGE_ACCOUNT: ${{ steps.storage.outputs.storage }}
          ENDPOINT: ${{ steps.publish.outputs.endpoint }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          title = 'Lantern Azure backup deployment'
          endpoint = os.environ.get('ENDPOINT', '').strip()
          status = os.environ.get('JOB_STATUS', 'unknown')
          verified = os.environ.get('VERIFY_OUTCOME') == 'success'
          result = 'VERIFIED' if verified else status.upper()
          body = f'''# Lantern Protocol Azure continuity deployment

          **Status:** {result}

          - Source commit: `{os.environ['GITHUB_SHA']}`
          - Resource group: `{os.environ['RESOURCE_GROUP']}`
          - Storage account: `{os.environ.get('STORAGE_ACCOUNT') or '(not resolved)'}`
          - Azure endpoint: {endpoint or '(not available)'}
          - Storage step: `{os.environ.get('STORAGE_OUTCOME', 'unknown')}`
          - Publish step: `{os.environ.get('PUBLISH_OUTCOME', 'unknown')}`
          - Endpoint verification: `{os.environ.get('VERIFY_OUTCOME', 'unknown')}`
          - Recorded: `{datetime.now(timezone.utc).isoformat()}`

          A `VERIFIED` status means the workflow fetched the public Azure endpoint and confirmed the Lantern hero, ETS Technical Briefing, deployed app.js showcase for M365 Connector, Provenance, AI Witness, complete ETS platform, and both designated partner-inquiry addresses. Primary ETS Core and Gateway resources are outside this static-site deployment path.
          '''
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'lantern-site-backup-deploy',
          }

          def request(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          query = urllib.parse.urlencode({'q': f'repo:{repo} is:issue in:title "{title}"'})
          found = request(f'https://api.github.com/search/issues?{query}')
          issue = next((item for item in found.get('items', []) if item.get('title') == title), None)
          if issue:
              request(f"https://api.github.com/repos/{repo}/issues/{issue['number']}", 'PATCH', {'body': body, 'state': 'open'})
          else:
              request(f'https://api.github.com/repos/{repo}/issues', 'POST', {'title': title, 'body': body})
          PY
