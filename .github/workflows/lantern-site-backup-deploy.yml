name: Deploy Lantern Protocol Azure Backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/lantern-site-backup/site/**'
      - '.github/workflows/lantern-site-backup-deploy.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: lantern-site-backup-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static continuity site
    runs-on: ubuntu-latest
    environment: ets-azure-q1
    timeout-minutes: 20
    env:
      RESOURCE_GROUP: rg-ets-live-eastus
      SITE_SOURCE: ops/lantern-site-backup/site
      EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Azure login with existing ETS workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate live EchoMedia deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          active_subscription="$(az account show --query id -o tsv)"
          active_tenant="$(az account show --query tenantId -o tsv)"
          test "${active_subscription,,}" = "${EXPECTED_SUBSCRIPTION_ID,,}"
          test "${active_tenant,,}" = "${EXPECTED_TENANT_ID,,}"
          location="$(az group show --name "$RESOURCE_GROUP" --query location -o tsv)"
          test "$location" = "eastus"
          test -f "$SITE_SOURCE/index.html"
          test -f "$SITE_SOURCE/styles.css"

      - name: Create or reuse isolated static-site storage
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          suffix="$(printf '%s' "${EXPECTED_SUBSCRIPTION_ID}:${RESOURCE_GROUP}:lantern" | sha256sum | cut -c1-13)"
          storage="lanternbkp${suffix}"
          if ! az storage account show --name "$storage" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az storage account create \
              --name "$storage" \
              --resource-group "$RESOURCE_GROUP" \
              --location eastus \
              --sku Standard_LRS \
              --kind StorageV2 \
              --https-only true \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false \
              --tags workload=lantern-site purpose=business-continuity owner=echomedia \
              --output none
          fi
          az storage account update \
            --name "$storage" \
            --resource-group "$RESOURCE_GROUP" \
            --https-only true \
            --min-tls-version TLS1_2 \
            --allow-blob-public-access false \
            --output none
          echo "storage=$storage" >> "$GITHUB_OUTPUT"

      - name: Enable static website and publish captured continuity copy
        id: publish
        shell: bash
        env:
          STORAGE_ACCOUNT: ${{ steps.storage.outputs.storage }}
        run: |
          set -euo pipefail
          key="$(az storage account keys list --account-name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" --query '[0].value' -o tsv)"
          test -n "$key"
          echo "::add-mask::$key"
          az storage blob service-properties update \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$key" \
            --static-website true \
            --index-document index.html \
            --404-document 404.html \
            --output none
          az storage blob delete-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$key" \
            --source '$web' \
            --output none || true
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$key" \
            --destination '$web' \
            --source "$SITE_SOURCE" \
            --overwrite true \
            --output none
          unset key
          endpoint="$(az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" --query primaryEndpoints.web -o tsv)"
          test -n "$endpoint"
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"

      - name: Verify public backup endpoint
        shell: bash
        env:
          ENDPOINT: ${{ steps.publish.outputs.endpoint }}
        run: |
          set -euo pipefail
          test -n "$ENDPOINT"
          for attempt in $(seq 1 12); do
            if body="$(curl --fail --silent --show-error --max-time 10 "$ENDPOINT")"; then
              printf '%s' "$body" | grep -Fq 'Evidence you can prove.'
              printf '%s' "$body" | grep -Fq 'ETS TECHNICAL BRIEFING'
              printf '%s' "$body" | grep -Fq 'shannon.bray@echomedia.ai'
              printf '%s' "$body" | grep -Fq 'shannonbraync@outlook.com'
              break
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 5
          done
          {
            echo '## Lantern Protocol Azure backup'
            echo
            echo "- Endpoint: $ENDPOINT"
            echo "- Resource group: $RESOURCE_GROUP"
            echo "- Storage account: ${{ steps.storage.outputs.storage }}"
            echo '- Primary ETS Core/Gateway resources were not modified.'
            echo '- Contact form routes through the visitor email client to both designated Lantern addresses.'
          } >> "$GITHUB_STEP_SUMMARY"
