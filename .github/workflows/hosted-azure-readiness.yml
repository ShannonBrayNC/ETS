name: Hosted Azure Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-azure-readiness:
    name: Hosted Azure signer readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ETS_AZURE_HOSTED_TESTS_ENABLED: ${{ secrets.ETS_AZURE_HOSTED_TESTS_ENABLED }}
      ETS_AZURE_MANAGED_IDENTITY_ENABLED: ${{ secrets.ETS_AZURE_MANAGED_IDENTITY_ENABLED }}
      ETS_AZURE_MANAGED_IDENTITY_CLIENT_ID: ${{ secrets.ETS_AZURE_MANAGED_IDENTITY_CLIENT_ID }}
      ETS_AZURE_KEY_VAULT_URL: ${{ secrets.ETS_AZURE_KEY_VAULT_URL }}
      ETS_AZURE_KEY_NAME: ${{ secrets.ETS_AZURE_KEY_NAME }}
      ETS_AZURE_KEY_VERSION: ${{ secrets.ETS_AZURE_KEY_VERSION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with hosted Azure dependencies
        run: python -m pip install -e ".[dev,azure]"

      - name: Run hosted Azure readiness tests
        run: python -m pytest tests/hosted/test_azure_live_signer.py
