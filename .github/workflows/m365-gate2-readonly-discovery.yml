name: M365 Gate 2 Read-Only Discovery

on:
  push:
    branches:
      - migration/m365-gate2-readonly-discovery
    paths:
      - '.github/workflows/m365-gate2-readonly-discovery.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: m365-gate2-readonly-discovery
  cancel-in-progress: true

jobs:
  destination-discovery:
    name: Discover destination federation state
    runs-on: ubuntu-latest
    environment: ets-azure-migration-destination-read
    timeout-minutes: 10
    env:
      AZURE_CORE_ONLY_SHOW_ERRORS: 'true'
      EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: rg-ets-prod-eastus
      MANAGED_IDENTITY_NAME: ets-oif5r5ydprrou-gw-id
      APP_DISPLAY_NAME: ETS Gateway SharePoint Cross-Tenant
    steps:
      - name: Check out exact discovery source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Azure login with destination workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify destination Azure context and UAMI
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          tenant="$(az account show --query tenantId -o tsv)"
          subscription="$(az account show --query id -o tsv)"
          if [[ "$tenant" != "$EXPECTED_TENANT_ID" || "$subscription" != "$EXPECTED_SUBSCRIPTION_ID" ]]; then
            echo 'Destination Azure context mismatch.' >&2
            exit 2
          fi

          principal_id="$(az identity show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$MANAGED_IDENTITY_NAME" \
            --query principalId -o tsv)"
          if [[ -z "$principal_id" ]]; then
            echo 'Destination Gateway UAMI principalId was not returned.' >&2
            exit 2
          fi
          printf 'principal_id=%s\n' "$principal_id" >> "$GITHUB_OUTPUT"
          echo 'destination_azure_context=verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'destination_gateway_uami=verified' >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve EchoMedia Microsoft resource tenant from public OIDC metadata
        id: resource
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 \
            'https://login.microsoftonline.com/echomedia.ai/v2.0/.well-known/openid-configuration')"
          issuer="$(jq -r '.issuer // empty' <<<"$metadata")"
          if [[ ! "$issuer" =~ ^https://login\.microsoftonline\.com/([0-9A-Fa-f-]{36})/v2\.0$ ]]; then
            echo 'EchoMedia OIDC issuer did not resolve to a tenant GUID.' >&2
            exit 2
          fi
          resource_tenant_id="${BASH_REMATCH[1]}"
          if [[ "$resource_tenant_id" == "$EXPECTED_TENANT_ID" ]]; then
            echo 'Cross-tenant boundary collapsed unexpectedly.' >&2
            exit 2
          fi
          printf 'tenant_id=%s\n' "$resource_tenant_id" >> "$GITHUB_OUTPUT"
          echo "microsoft_resource_tenant_id=$resource_tenant_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Read destination application and FIC state through Microsoft Graph
        shell: bash
        env:
          UAMI_PRINCIPAL_ID: ${{ steps.destination.outputs.principal_id }}
        run: |
          set -euo pipefail

          app_url='https://graph.microsoft.com/v1.0/applications?%24filter=displayName%20eq%20%27ETS%20Gateway%20SharePoint%20Cross-Tenant%27&%24select=id%2CappId%2CdisplayName%2CsignInAudience'
          error_file="$RUNNER_TEMP/gate2-graph-error.txt"
          set +e
          app_json="$(az rest --method get --url "$app_url" --output json 2>"$error_file")"
          graph_status=$?
          set -e

          if [[ $graph_status -ne 0 ]]; then
            echo 'first_blocker=destination_graph_read_authority' >> "$GITHUB_STEP_SUMMARY"
            echo 'mutation_performed=false' >> "$GITHUB_STEP_SUMMARY"
            if grep -Eqi '403|Authorization_RequestDenied|Insufficient privileges' "$error_file"; then
              echo 'graph_result=read_denied' >> "$GITHUB_STEP_SUMMARY"
              exit 3
            fi
            echo 'graph_result=read_failed' >> "$GITHUB_STEP_SUMMARY"
            exit 3
          fi

          count="$(jq '.value | length' <<<"$app_json")"
          if [[ "$count" -eq 0 ]]; then
            echo 'first_missing_stage=destination_multitenant_application' >> "$GITHUB_STEP_SUMMARY"
            echo 'mutation_required=true' >> "$GITHUB_STEP_SUMMARY"
            echo 'mutation_performed=false' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$count" -ne 1 ]]; then
            echo 'Destination application display name did not resolve uniquely.' >&2
            exit 2
          fi

          object_id="$(jq -r '.value[0].id' <<<"$app_json")"
          audience="$(jq -r '.value[0].signInAudience' <<<"$app_json")"
          if [[ "$audience" != 'AzureADMultipleOrgs' ]]; then
            echo 'first_missing_stage=destination_multitenant_application_configuration' >> "$GITHUB_STEP_SUMMARY"
            echo 'mutation_required=true' >> "$GITHUB_STEP_SUMMARY"
            echo 'mutation_performed=false' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          fic_url="https://graph.microsoft.com/v1.0/applications/${object_id}/federatedIdentityCredentials?%24select=id%2Cname%2Cissuer%2Csubject%2Caudiences"
          fic_json="$(az rest --method get --url "$fic_url" --output json)"
          fic_count="$(jq '.value | length' <<<"$fic_json")"
          expected_issuer="https://login.microsoftonline.com/${EXPECTED_TENANT_ID}/v2.0"
          matching_count="$(jq --arg issuer "$expected_issuer" \
            --arg subject "$UAMI_PRINCIPAL_ID" \
            '[.value[] | select(.issuer == $issuer and .subject == $subject and (.audiences | length) == 1 and .audiences[0] == "api://AzureADTokenExchange")] | length' \
            <<<"$fic_json")"

          if [[ "$fic_count" -eq 0 ]]; then
            echo 'first_missing_stage=destination_federated_identity_credential' >> "$GITHUB_STEP_SUMMARY"
            echo 'mutation_required=true' >> "$GITHUB_STEP_SUMMARY"
            echo 'mutation_performed=false' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$fic_count" -ne 1 || "$matching_count" -ne 1 ]]; then
            echo 'Destination SharePoint application has an unexpected federated credential set.' >&2
            exit 2
          fi

          echo 'destination_federation_state=exact' >> "$GITHUB_STEP_SUMMARY"
          echo 'next_stage=resource_tenant_enterprise_application_readback' >> "$GITHUB_STEP_SUMMARY"
          echo 'mutation_performed=false' >> "$GITHUB_STEP_SUMMARY"

      - name: Clear Azure session
        if: always()
        shell: bash
        run: az account clear
