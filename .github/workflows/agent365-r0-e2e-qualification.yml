name: Agent 365 R0 End-to-End Qualification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent365-r0-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Frozen mission durable reconstruction
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ETS
        run: python -m pip install -e ".[dev]"

      - name: Run reference qualification
        run: |
          python -m ets.demos.agent365_r0_qualification \
            --workdir qualification-output/agent365-r0 \
            --mission-id 4db39caa-3794-47f7-9bf0-bf5cf79fb912

      - name: Verify restart and HTTP reconstruction
        run: pytest -q tests/test_agent365_r0_end_to_end_qualification.py

      - name: Upload qualification package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent365-r0-e2e-qualification
          path: qualification-output/agent365-r0
          if-no-files-found: error
