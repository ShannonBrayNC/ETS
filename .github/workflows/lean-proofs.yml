name: Lean Mechanized Proofs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lean-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate setup retry behavior
        run: python3 -m unittest discover -s tests/ci -p test_ci_retry.py

      - name: Install elan
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 60 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash scripts/ci-retry.sh 3 180 5 sh elan-init.sh -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean toolchain
        run: |
          toolchain=$(cat formal/lean/lean-toolchain)
          bash scripts/ci-retry.sh 3 180 5 elan toolchain install "$toolchain"
          mkdir -p artifacts/lean-proofs
          (cd formal/lean && timeout --kill-after=10s 30s lean --version) | tee artifacts/lean-proofs/toolchain.txt

      - name: Validate mechanized proof files
        run: |
          test -f formal/lean/lakefile.lean
          test -f formal/lean/src/ETSProofs/TemporalLiveness.lean
          test -f formal/lean/src/ETSProofs/Fairness.lean
          test -f formal/lean/src/ETSProofs/ByzantineTemporal.lean
          test -f docs/dissertation/MECHANIZED_TEMPORAL_PROOFS.md
          test -f docs/dissertation/MECHANIZED_FAIRNESS_PROOFS.md
          test -f docs/dissertation/BYZANTINE_TEMPORAL_THEOREMS.md
          test -f scripts/run-lean-proofs.sh

      - name: Execute Lean theorem evidence capture
        env:
          LEAN_OUTPUT_DIR: artifacts/lean-proofs
        run: bash scripts/run-lean-proofs.sh

      - name: Upload Lean proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-proof-artifacts
          path: artifacts/lean-proofs/
          if-no-files-found: warn

      - name: Publish proof summary
        if: success()
        run: |
          echo "Mechanized theorem proofs validated successfully." >> $GITHUB_STEP_SUMMARY
          echo "Validated proof domains are listed in artifacts/lean-proofs/summary.md." >> $GITHUB_STEP_SUMMARY
          echo "Current Byzantine proofs mechanize bounded adversarial classification semantics, not universal Byzantine consensus." >> $GITHUB_STEP_SUMMARY
