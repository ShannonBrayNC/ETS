name: Windows verifier candidate

on:
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'ets/core/**'
      - 'ets/verifier/**'
      - 'ets/desktop/**'
      - 'ets/reports/**'
      - 'ets/election/**'
      - 'ets/version.py'
      - 'tests/unit/test_verifier_standalone.py'
      - 'tests/unit/test_verifier_input.py'
      - 'tests/unit/test_verifier_strict_reports.py'
      - 'tests/unit/test_desktop_controller.py'
      - 'tests/unit/test_desktop_smoke.py'
      - 'tests/unit/test_msix_layout.py'
      - 'tests/unit/test_dependency_evidence.py'
      - 'tests/unit/test_candidate_record.py'
      - 'tests/e2e/desktop/**'
      - 'tests/fixtures/verifier/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-verifier-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install runtime and build dependencies
        run: python -m pip install . -r packaging/windows/requirements-build.txt "pytest>=9.0.3,<10"
      - name: Test source verifier
        run: python -m pytest tests/unit/test_verifier_service.py tests/unit/test_verifier_cli_golden_paths.py tests/unit/test_verifier_standalone.py tests/unit/test_verifier_input.py tests/unit/test_verifier_strict_reports.py
      - name: Freeze standalone runtime
        run: python -m PyInstaller --clean --noconfirm packaging/windows/verifier.spec
      - name: Exercise relocated frozen executable
        shell: pwsh
        run: |
          $env:ETS_VERIFY_EXECUTABLE = (Resolve-Path dist/ets-verify/ets-verify.exe).Path
          python -m pytest tests/unit/test_verifier_standalone.py --junitxml=test-results/windows-verifier.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record dependency inventory and file hashes
        shell: pwsh
        run: |
          python -m pip freeze | Out-File test-results/build-environment.txt -Encoding utf8
          $root = (Resolve-Path dist/ets-verify).Path
          Get-ChildItem $root -File -Recurse | ForEach-Object {
            [PSCustomObject]@{
              path = [IO.Path]::GetRelativePath($root, $_.FullName)
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          } | ConvertTo-Json | Out-File test-results/runtime-sha256.json -Encoding utf8
          "source_sha=${{ github.sha }}" | Out-File test-results/source.txt -Encoding utf8
      - name: Test desktop controller
        run: python -m pytest tests/unit/test_desktop_controller.py tests/unit/test_desktop_smoke.py --junitxml=test-results/desktop-controller.xml
      - name: Build desktop host
        shell: pwsh
        run: |
          python -m pip install -r packaging/windows/requirements-desktop.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --clean --noconfirm packaging/windows/desktop.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/ets-verify dist/ets-desktop/verifier -Recurse
      - name: Launch native WebView2 smoke test
        shell: pwsh
        run: |
          $result = Join-Path $PWD 'test-results/desktop-smoke.json'
          $fixture = (Resolve-Path tests/fixtures/verifier/native-signed.json).Path
          $trust = (Resolve-Path tests/fixtures/verifier/native-trust.json).Path
          $process = Start-Process dist/ets-desktop/ets-desktop.exe -ArgumentList '--smoke-test', '--smoke-result', $result, '--smoke-bundle', $fixture, '--smoke-trust', $trust -PassThru
          if (-not $process.WaitForExit(300000)) { $process.Kill(); Get-Content $result -ErrorAction SilentlyContinue; throw 'Desktop smoke test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content $result -ErrorAction SilentlyContinue; throw 'Desktop smoke test failed' }
          Get-Content $result
      - name: Exercise desktop with program network blocks
        shell: pwsh
        run: ./packaging/windows/test-desktop-offline.ps1
      - name: Collect dependency license evidence
        shell: pwsh
        run: |
          python -m pytest tests/unit/test_dependency_evidence.py --junitxml=test-results/dependency-evidence.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/windows/collect_dependency_evidence.py --output dist/ets-desktop/THIRD_PARTY_EVIDENCE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload unsigned desktop candidate
        uses: actions/upload-artifact@v4
        with:
          name: ets-desktop-windows-x64-unsigned-${{ github.sha }}
          path: dist/ets-desktop/
          if-no-files-found: error
      - name: Validate MSIX layout tests
        run: python -m pytest tests/unit/test_msix_layout.py --junitxml=test-results/msix-layout.xml
      - name: Test signing preflight rejection paths
        shell: pwsh
        run: ./packaging/windows/test-signing-preflight.ps1
      - name: Build and validate unsigned development MSIX
        shell: pwsh
        run: ./packaging/windows/build-msix.ps1
      - name: Verify client preflight rejects unsigned Server candidate
        shell: pwsh
        run: |
          $package = (Get-ChildItem dist/msix/*.msix | Select-Object -First 1).FullName
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash
          & ./packaging/windows/client-preflight.ps1 -Package $package -ExpectedSha256 $hash -OutputFile test-results/client-preflight.json
          if ($LASTEXITCODE -ne 2) { throw 'Expected client preflight rejection on engineering runner' }
          $report = Get-Content test-results/client-preflight.json -Raw | ConvertFrom-Json
          if ($report.clientQualified -or $report.releaseApproved -or $report.automaticPrerequisitesPassed) { throw 'False client qualification' }
          if (-not $report.checks.reviewedHashMatches -or $report.checks.signatureTrustedOnThisMachine -or $report.checks.windows11Client) { throw 'Incorrect preflight observations' }
          & ./packaging/windows/client-preflight.ps1 -Package $package -ExpectedSha256 ('0' * 64) -OutputFile test-results/client-preflight-wrong-hash.json
          if ($LASTEXITCODE -ne 2) { throw 'Expected mismatched hash rejection' }
          $mismatch = Get-Content test-results/client-preflight-wrong-hash.json -Raw | ConvertFrom-Json
          if ($mismatch.checks.reviewedHashMatches) { throw 'Mismatched hash was accepted' }
          exit 0
      - name: Assemble self-contained review candidate
        shell: pwsh
        env:
          CANDIDATE_SOURCE_SHA: ${{ github.sha }}
          CANDIDATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m pytest tests/unit/test_candidate_record.py --junitxml=test-results/candidate-record.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CANDIDATE_SOURCE_SHA) { throw 'Candidate source mismatch' }
          python packaging/windows/candidate_record.py assemble --packages dist/msix --results test-results --output dist/candidate-review --source-sha $actual --run-url $env:CANDIDATE_RUN_URL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/windows/candidate_record.py verify dist/candidate-review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload review candidate
        uses: actions/upload-artifact@v4
        with:
          name: ets-verifier-review-${{ github.sha }}
          path: dist/candidate-review/
          if-no-files-found: error
      - name: Upload unsigned development MSIX
        uses: actions/upload-artifact@v4
        with:
          name: ets-verifier-development-msix-${{ github.sha }}
          path: |
            dist/msix/*.msix
            dist/msix/*.json
          if-no-files-found: error
      - name: Upload unsigned engineering candidate
        uses: actions/upload-artifact@v4
        with:
          name: ets-verifier-windows-x64-unsigned-${{ github.sha }}
          path: dist/ets-verify/
          if-no-files-found: error
      - name: Upload qualification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ets-verifier-windows-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn

  desktop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: tests/e2e/desktop
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e/desktop
      - run: npm test
        working-directory: tests/e2e/desktop
