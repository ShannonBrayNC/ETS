name: Security Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ETS and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit Python dependencies
        run: |
          # CVE-2026-69247 affects PKCS#7 decryption APIs that ETS does not invoke.
          # Stable cryptography 50.0.0 is not yet available.
          # Governance record: docs/security/DEPENDENCY_AUDIT_EXCEPTIONS.md
          python -m pip_audit --ignore-vuln CVE-2026-69247

  explorer-dependency-audit:
    name: Explorer dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ets/explorer-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ets/explorer-ui/package-lock.json

      - name: Install locked Explorer dependencies
        run: npm ci

      - name: Audit Explorer dependencies
        run: npm audit --audit-level=moderate

      - name: Build Explorer
        run: npm run build

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-federation:
    name: Docker federation health check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build and validate six-node federation
        shell: pwsh
        run: ./scripts/validate-docker-federation.ps1 -StartupSeconds 30

      - name: Capture federation diagnostics on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Ensure federation teardown
        if: always()
        run: docker compose down --volumes --remove-orphans
