name: Security Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ETS and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit Python dependencies
        run: python -m pip_audit

  explorer-dependency-audit:
    name: Explorer dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ets/explorer-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ets/explorer-ui/package-lock.json

      - name: Install locked Explorer dependencies
        run: npm ci

      - name: Audit Explorer dependencies
        run: npm audit --audit-level=moderate

      - name: Build Explorer
        run: npm run build
