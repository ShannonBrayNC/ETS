name: Hosted Azure Q0 Immutable Image Publication

on:
  workflow_dispatch:
    inputs:
      container_registry_name:
        description: Existing approved private Azure Container Registry name
        required: true
        type: string
      container_registry_resource_group:
        description: Resource group containing the approved private ACR
        required: true
        type: string
      image_repository:
        description: Non-customer ACR repository path for the hosted Q1 image
        required: true
        default: ets/hosted-q1
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: hosted-azure-q0-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build, scan, attest, and publish immutable Q1 image
    runs-on: ubuntu-24.04
    environment: ets-azure-q1
    timeout-minutes: 60
    env:
      AZURE_CORE_ONLY_SHOW_ERRORS: 'true'

    steps:
      - name: Check out exact publication source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert exact source and Q1-capable Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          test -f Dockerfile
          test -f scripts/qualify_hosted_azure_live.py
          test -f scripts/acr_oauth_docker_login.py
          grep -q 'COPY scripts/qualify_hosted_azure_live.py ./scripts/qualify_hosted_azure_live.py' Dockerfile
          mkdir -p evidence/host-az-q0-image
          printf 'source_sha=%s\nworkflow_run_id=%s\n' "$actual" "$GITHUB_RUN_ID" \
            > evidence/host-az-q0-image/source.txt

      - name: Azure login with workload identity
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate approved private ACR posture
        id: registry
        shell: bash
        env:
          ACR_NAME: ${{ inputs.container_registry_name }}
          ACR_RESOURCE_GROUP: ${{ inputs.container_registry_resource_group }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          set -euo pipefail
          python - "$IMAGE_REPOSITORY" <<'PY'
          import re
          import sys

          repository = sys.argv[1]
          if re.fullmatch(r"[a-z0-9]+(?:[._/-][a-z0-9]+)*", repository) is None:
              raise SystemExit("image_repository must be a lowercase, non-empty ACR repository path")
          PY

          active_subscription="$(az account show --query id -o tsv)"
          registry_json="$RUNNER_TEMP/q0-registry.json"
          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$ACR_RESOURCE_GROUP" \
            --query '{id:id,loginServer:loginServer,adminUserEnabled:adminUserEnabled,publicNetworkAccess:publicNetworkAccess,networkDefaultAction:networkRuleSet.defaultAction,roleAssignmentMode:roleAssignmentMode}' \
            -o json > "$registry_json"

          readarray -t registry_values < <(python - "$registry_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in (
              "id",
              "loginServer",
              "adminUserEnabled",
              "publicNetworkAccess",
              "networkDefaultAction",
              "roleAssignmentMode",
          ):
              value = payload.get(key)
              if isinstance(value, bool):
                  value = str(value).lower()
              print("" if value is None else str(value))
          PY
          )
          registry_id="${registry_values[0]}"
          registry_server="${registry_values[1]}"
          admin_enabled="${registry_values[2],,}"
          public_network_access="${registry_values[3]:-unknown}"
          network_default_action="${registry_values[4]:-unknown}"
          role_assignment_mode="${registry_values[5]:-unknown}"

          registry_subscription="$(printf '%s' "$registry_id" | cut -d/ -f3)"
          if [ "${registry_subscription,,}" != "${active_subscription,,}" ]; then
            echo "Q0 ACR must be in the active Azure subscription." >&2
            exit 1
          fi
          if [ "$admin_enabled" != "false" ]; then
            echo "Q0 ACR admin user must be disabled." >&2
            exit 1
          fi
          arm_status="$(az acr config authentication-as-arm show \
            --registry "$ACR_NAME" \
            --resource-group "$ACR_RESOURCE_GROUP" \
            --query status -o tsv | tr '[:upper:]' '[:lower:]')"
          if [ "$arm_status" != "enabled" ]; then
            echo "Q0 ACR must allow ARM-audience authentication for the downstream managed-identity pull boundary." >&2
            exit 1
          fi
          if [ "${public_network_access,,}" = "disabled" ]; then
            echo "Q0 ACR public network access is disabled; a GitHub-hosted runner cannot reach the registry data plane without a private runner/network path." >&2
            exit 1
          fi

          tag="q1-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          subject_name="$registry_server/$IMAGE_REPOSITORY"
          tag_ref="$subject_name:$tag"
          echo "registry_server=$registry_server" >> "$GITHUB_OUTPUT"
          echo "subject_name=$subject_name" >> "$GITHUB_OUTPUT"
          echo "tag_ref=$tag_ref" >> "$GITHUB_OUTPUT"
          echo "role_assignment_mode=$role_assignment_mode" >> "$GITHUB_OUTPUT"

          cat > evidence/host-az-q0-image/registry.txt <<EOF
          registry_name=$ACR_NAME
          registry_resource_group=$ACR_RESOURCE_GROUP
          registry_server=$registry_server
          image_repository=$IMAGE_REPOSITORY
          acr_admin_user_enabled=false
          arm_audience_authentication=true
          public_network_access=$public_network_access
          network_default_action=$network_default_action
          role_assignment_mode=$role_assignment_mode
          registry_credentials_retained=false
          docker_authentication=direct_acr_oauth_exchange
          EOF

      - name: Probe ACR data-plane reachability
        id: data_plane
        shell: bash
        env:
          REGISTRY_SERVER: ${{ steps.registry.outputs.registry_server }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          server = os.environ["REGISTRY_SERVER"].strip()
          request = urllib.request.Request(
              f"https://{server}/v2/",
              headers={"User-Agent": "ets-q0-data-plane-probe/1"},
              method="GET",
          )
          classification = "unknown"
          status = 0
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = int(response.status)
                  classification = "reachable"
          except urllib.error.HTTPError as exc:
              status = int(exc.code)
              body = exc.read().decode("utf-8", errors="replace").lower()
              if status == 401:
                  classification = "reachable_auth_required"
              elif status == 403 and any(
                  marker in body
                  for marker in ("not allowed access", "firewall", "network rule", "client with ip")
              ):
                  classification = "network_denied"
              elif status == 403:
                  classification = "preauth_forbidden"
              else:
                  classification = f"http_{status}"
          except urllib.error.URLError:
              classification = "transport_error"

          evidence = {
              "schema_version": "ets.host_az.q0_acr_data_plane_probe.v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "http_status": status,
              "classification": classification,
              "customer_identifiers_retained": False,
              "reusable_credential_retained": False,
          }
          Path("evidence/host-az-q0-image/data-plane-probe.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"ACR data-plane probe: {classification} (HTTP {status})")
          if classification == "network_denied":
              raise SystemExit(
                  "ACR data plane denied the GitHub-hosted runner before authentication; "
                  "review publicNetworkAccess/network rules or use an approved private runner path"
              )
          if classification not in {"reachable", "reachable_auth_required"}:
              raise SystemExit(
                  "ACR data-plane reachability is not in the qualified pre-authentication state"
              )
          PY

      - name: Authenticate Docker through ACR OAuth exchange
        shell: bash
        env:
          REGISTRY_SERVER: ${{ steps.registry.outputs.registry_server }}
          ROLE_ASSIGNMENT_MODE: ${{ steps.registry.outputs.role_assignment_mode }}
        run: |
          set -euo pipefail
          export ACR_TENANT_ID="$(az account show --query tenantId -o tsv)"
          export ACR_AAD_ACCESS_TOKEN="$(az account get-access-token \
            --scope https://containerregistry.azure.net/.default \
            --query accessToken -o tsv)"
          expected_role="mode-appropriate repository writer"
          case "$ROLE_ASSIGNMENT_MODE" in
            AbacRepositoryPermissions|rbac-abac)
              expected_role="Container Registry Repository Writer"
              ;;
            LegacyRegistryPermissions|rbac)
              expected_role="AcrPush"
              ;;
          esac
          if ! python scripts/acr_oauth_docker_login.py; then
            unset ACR_AAD_ACCESS_TOKEN ACR_TENANT_ID
            echo "::error::ACR OAuth exchange failed after data-plane reachability passed. Verify #374 grants this GitHub OIDC publisher the $expected_role role for ets/hosted-q1 (or its approved repository prefix), and allow Azure RBAC propagation before retrying." >&2
            exit 1
          fi
          unset ACR_AAD_ACCESS_TOKEN ACR_TENANT_ID

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push Q1 image
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.tag_ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ETS Hosted Q1
          provenance: mode=max
          sbom: true

      - name: Require immutable digest and verify registry subject
        id: image
        shell: bash
        env:
          SUBJECT_NAME: ${{ steps.registry.outputs.subject_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python - "$IMAGE_DIGEST" <<'PY'
          import re
          import sys

          digest = sys.argv[1]
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("build did not return a canonical sha256 image digest")
          PY
          immutable_ref="$SUBJECT_NAME@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$immutable_ref" >/dev/null
          echo "immutable_ref=$immutable_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$immutable_ref" > evidence/host-az-q0-image/immutable-image.txt

      - name: Generate retained SPDX JSON SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.image.outputs.immutable_ref }}
          format: spdx-json
          output-file: evidence/host-az-q0-image/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate retained HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.immutable_ref }}
          scan-type: image
          format: json
          output: evidence/host-az-q0-image/trivy-high-critical.json
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Summarize vulnerability gate and publication manifest
        id: gate
        shell: bash
        env:
          SUBJECT_NAME: ${{ steps.registry.outputs.subject_name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMMUTABLE_REF: ${{ steps.image.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("evidence/host-az-q0-image/trivy-high-critical.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          severities = ("HIGH", "CRITICAL")
          fixable = {severity: 0 for severity in severities}
          upstream_unfixed = {severity: 0 for severity in severities}
          for result in report.get("Results") or []:
              for finding in result.get("Vulnerabilities") or []:
                  severity = str(finding.get("Severity", "")).upper()
                  if severity not in fixable:
                      continue
                  fixed_version = str(finding.get("FixedVersion") or "").strip()
                  if fixed_version:
                      fixable[severity] += 1
                  else:
                      upstream_unfixed[severity] += 1
          gate = "PASS" if sum(fixable.values()) == 0 else "FAIL"
          summary = {
              "gate": gate,
              "policy": "fail_on_fixable_high_critical_v1",
              "fixable": {
                  "high": fixable["HIGH"],
                  "critical": fixable["CRITICAL"],
              },
              "upstream_unfixed": {
                  "high": upstream_unfixed["HIGH"],
                  "critical": upstream_unfixed["CRITICAL"],
              },
          }
          Path("evidence/host-az-q0-image/vulnerability-gate.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          manifest = {
              "schema_version": "ets.host_az.q0_image.v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "subject_name": os.environ["SUBJECT_NAME"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "immutable_image": os.environ["IMMUTABLE_REF"],
              "sbom": "sbom.spdx.json",
              "vulnerability_report": "trivy-high-critical.json",
              "vulnerability_gate": gate,
              "vulnerability_gate_policy": "fail_on_fixable_high_critical_v1",
              "upstream_unfixed_high": upstream_unfixed["HIGH"],
              "upstream_unfixed_critical": upstream_unfixed["CRITICAL"],
              "registry_credentials_retained": False,
              "customer_identifiers_retained": False,
          }
          Path("evidence/host-az-q0-image/manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"vulnerability_gate={gate}\n")
          PY

      - name: Create GitHub build-provenance attestation
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ steps.registry.outputs.subject_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub SBOM attestation
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ steps.registry.outputs.subject_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: evidence/host-az-q0-image/sbom.spdx.json
          push-to-registry: true

      - name: Upload non-secret Q0 image evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: host-az-q0-image-${{ github.run_id }}
          path: evidence/host-az-q0-image/
          if-no-files-found: error
          retention-days: 90

      - name: Log out Docker from ACR
        if: always() && steps.registry.outputs.registry_server != ''
        shell: bash
        env:
          REGISTRY_SERVER: ${{ steps.registry.outputs.registry_server }}
        run: docker logout "$REGISTRY_SERVER" >/dev/null 2>&1 || true

      - name: Enforce vulnerability gate
        if: always()
        shell: bash
        env:
          VULNERABILITY_GATE: ${{ steps.gate.outputs.vulnerability_gate }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if [ "$GATE_OUTCOME" != "success" ]; then
            echo "Q0 vulnerability scan/gate did not complete; inspect the first failed step above." >&2
            exit 1
          fi
          if [ "$VULNERABILITY_GATE" != "PASS" ]; then
            echo "Q0 image contains fixable HIGH/CRITICAL vulnerability findings." >&2
            exit 1
          fi
