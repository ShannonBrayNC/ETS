name: SDK Release Candidate

on:
  pull_request:
    paths:
      - "ets/sdk/**"
      - "sdk/dotnet/Ets.Application/**"
      - "sdk/dotnet/Ets.Application.Tests/**"
      - "sdk/typescript/**"
      - "conformance/sdk/**"
      - "docs/sdk/**"
      - "examples/sdk/**"
      - "tests/unit/test_sdk_offline_example.py"
      - "tests/unit/test_sdk_test_kit.py"
      - "scripts/build_sdk_test_kit.py"
      - "scripts/*sdk_release*"
      - "pyproject.toml"
      - ".github/workflows/sdk-release-candidate.yml"
      - ".github/workflows/sdk-publish.yml"
  push:
    branches:
      - main
    paths:
      - "ets/sdk/**"
      - "sdk/dotnet/Ets.Application/**"
      - "sdk/dotnet/Ets.Application.Tests/**"
      - "sdk/typescript/**"
      - "conformance/sdk/**"
      - "docs/sdk/**"
      - "examples/sdk/**"
      - "tests/unit/test_sdk_offline_example.py"
      - "tests/unit/test_sdk_test_kit.py"
      - "scripts/build_sdk_test_kit.py"
      - "scripts/*sdk_release*"
      - "pyproject.toml"
      - ".github/workflows/sdk-release-candidate.yml"
      - ".github/workflows/sdk-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify release matrix
        run: |
          python -m pip install -e .
          python scripts/verify_sdk_release_matrix.py

      - name: Build Python distribution
        run: |
          python -m pip install --upgrade build
          python -m build --outdir artifacts/python
          python -m pip install --force-reinstall artifacts/python/*.whl
          python -c "from ets.version import __version__; assert __version__ == '0.1.0a1'"

      - name: Build and test .NET package
        run: |
          dotnet restore sdk/dotnet/Ets.Application.Tests/Ets.Application.Tests.csproj
          dotnet test sdk/dotnet/Ets.Application.Tests/Ets.Application.Tests.csproj --configuration Release
          mkdir -p artifacts/dotnet
          dotnet msbuild sdk/dotnet/Ets.Application/Ets.Application.csproj -restore -t:Pack -p:Configuration=Release -p:PackageOutputPath="$GITHUB_WORKSPACE/artifacts/dotnet"

      - name: Build and test TypeScript package
        working-directory: sdk/typescript
        run: |
          npm install --package-lock-only
          npm ci
          npm test
          mkdir -p ../../artifacts/typescript
          npm pack --pack-destination ../../artifacts/typescript

      - name: Exercise installed SDK packages outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/ets-sdk-consumers"
          mkdir "$consumer"
          python -m venv "$consumer/python-env"
          "$consumer/python-env/bin/python" -m pip install "$GITHUB_WORKSPACE"/artifacts/python/*.whl
          cp -R examples/sdk/python "$consumer/python-example"
          cp -R examples/sdk/dotnet "$consumer/dotnet-example"
          cp -R examples/sdk/typescript "$consumer/typescript-example"
          cd "$consumer"
          "$consumer/python-env/bin/python" -I -c 'from ets.sdk import ETSClient; from ets.version import __version__; print(__version__)'
          "$consumer/python-env/bin/python" -I "$consumer/python-example/offline_roundtrip.py" --deterministic-smoke --output "$consumer/python-result"
          dotnet msbuild "$consumer/dotnet-example/Quickstart.csproj" -t:Restore "-p:RestoreSources=$GITHUB_WORKSPACE/artifacts/dotnet" "-p:RestorePackagesPath=$consumer/nuget-cache"
          dotnet run --no-restore --project "$consumer/dotnet-example/Quickstart.csproj" -- --smoke "$GITHUB_WORKSPACE/tests/fixtures/verifier/native-signed.json" "$consumer/dotnet-bundle.json"
          cd "$consumer/typescript-example"
          npm install --ignore-scripts --no-save --package-lock=false "$GITHUB_WORKSPACE"/artifacts/typescript/*.tgz
          node --input-type=module -e 'import { EtsClient } from "@lanternprotocol/ets-sdk"; if (typeof EtsClient !== "function") process.exit(1)'
          "$GITHUB_WORKSPACE/sdk/typescript/node_modules/.bin/tsc" --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 --lib ES2022,DOM typecheck.mts
          node quickstart.mjs --smoke "$GITHUB_WORKSPACE/tests/fixtures/verifier/native-signed.json" "$consumer/typescript-bundle.json"
          cd "$consumer"
          for language in dotnet typescript; do
            "$consumer/python-env/bin/python" -I -m ets.verifier.cli offline "$consumer/$language-bundle.json" --trust-store "$GITHUB_WORKSPACE/tests/fixtures/verifier/native-trust.json" --expected-log-id ets-cli-golden-fixture --report "$consumer/$language-report.json"
          done

      - name: Exercise PowerShell REST and strict CLI integration
        shell: pwsh
        run: |
          ./examples/sdk/powershell/test-quickstart.ps1 -Fixture tests/fixtures/verifier/native-signed.json -TrustStore tests/fixtures/verifier/native-trust.json -OutputDirectory "$env:RUNNER_TEMP/ets-powershell-smoke" -PythonExecutable "$env:RUNNER_TEMP/ets-sdk-consumers/python-env/bin/python"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.16.0
        with:
          path: artifacts
          format: spdx-json
          output-file: artifacts/sdk-release.spdx.json

      - name: Generate release manifest
        run: python scripts/build_sdk_release_manifest.py --commit-sha "$GITHUB_SHA"

      - name: Attest release bundle
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: artifacts/**/*

      - name: Assemble and verify documented SDK test kit
        run: |
          python scripts/build_sdk_test_kit.py --artifacts artifacts --output sdk-test-kit --commit-sha "$GITHUB_SHA"
          python scripts/build_sdk_test_kit.py --verify sdk-test-kit --commit-sha "$GITHUB_SHA"

      - name: Upload SDK test kit
        uses: actions/upload-artifact@v4
        with:
          name: sdk-test-kit
          path: sdk-test-kit
          if-no-files-found: error

      - name: Upload SDK release candidate
        uses: actions/upload-artifact@v4
        with:
          name: sdk-release-candidate
          path: artifacts
          if-no-files-found: error
