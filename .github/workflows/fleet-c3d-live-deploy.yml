name: Fleet C3D Live Private Substrate

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact approved main SHA to deploy
        required: true
        type: string
      q0_workflow_run_id:
        description: Successful Fleet C3C Q0 workflow run bound to expected_source_sha
        required: true
        type: string
      fleet_image:
        description: Protected Fleet Q0 repository@sha256:digest
        required: true
        type: string
      resource_group:
        description: Existing live ETS resource group
        required: true
        default: rg-ets-live-eastus
        type: string
      container_registry_name:
        description: Approved private ACR name
        required: true
        default: etsq1a352eb89
        type: string
      container_registry_resource_group:
        description: Resource group containing the approved private ACR
        required: true
        default: rg-ets-q1-eastus
        type: string
      entra_application_display_name:
        description: Governed single-tenant Fleet Entra application display name
        required: true
        default: ETS Fleet Control Plane
        type: string
      provision_entra_application:
        description: Create/converge the governed Fleet app if absent or incomplete
        required: true
        default: true
        type: boolean
      step_up_auth_context_id:
        description: Entra authentication-context ID reserved for SecurityAdmin step-up
        required: true
        default: c1
        type: string
      postgres_high_availability_mode:
        description: PostgreSQL Flexible Server HA mode
        required: true
        default: ZoneRedundant
        type: choice
        options:
          - ZoneRedundant
          - SameZone
          - Disabled

permissions:
  contents: read
  actions: read
  id-token: write

env:
  EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ets-azure-q1
    timeout-minutes: 75

    steps:
      - name: Check out exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_source_sha }}
          persist-credentials: false

      - name: Validate exact source and bounded deployment inputs
        shell: bash
        env:
          FLEET_IMAGE: ${{ inputs.fleet_image }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          Q0_RUN_ID: ${{ inputs.q0_workflow_run_id }}
          ACR_NAME: ${{ inputs.container_registry_name }}
          STEP_UP_AUTH_CONTEXT_ID: ${{ inputs.step_up_auth_context_id }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          printf '%s' "$EXPECTED_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$Q0_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$STEP_UP_AUTH_CONTEXT_ID" | grep -Eq '^c[0-9]{1,2}$'
          expected_subject="${ACR_NAME}.azurecr.io/ets/fleet/control-plane"
          FLEET_IMAGE="$FLEET_IMAGE" EXPECTED_SUBJECT="$expected_subject" python - <<'PY'
          import os
          import re

          image = os.environ['FLEET_IMAGE']
          subject = os.environ['EXPECTED_SUBJECT']
          if re.fullmatch(re.escape(subject) + r'@sha256:[0-9a-f]{64}', image) is None:
              raise SystemExit('fleet_image must be the approved Fleet Q0 repository@sha256 digest')
          PY

      - name: Require Q0 run and retained manifest from the same exact source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          Q0_RUN_ID: ${{ inputs.q0_workflow_run_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          FLEET_IMAGE: ${{ inputs.fleet_image }}
        run: |
          set -euo pipefail
          mkdir -p evidence/fleet-c3d "${RUNNER_TEMP}/fleet-q0"
          gh run view "$Q0_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,event,headBranch,headSha,status,conclusion \
            > "${RUNNER_TEMP}/q0-run.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path(os.environ['RUNNER_TEMP'], 'q0-run.json').read_text())
          if str(run.get('databaseId')) != os.environ['Q0_RUN_ID']:
              raise SystemExit('Fleet Q0 workflow run identity mismatch')
          if run.get('event') != 'workflow_dispatch':
              raise SystemExit('Fleet Q0 run was not workflow_dispatch')
          if run.get('headBranch') != 'main':
              raise SystemExit('Fleet Q0 run was not executed from main')
          if run.get('headSha') != os.environ['EXPECTED_SOURCE_SHA']:
              raise SystemExit('Fleet Q0 run is not bound to expected_source_sha')
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('Fleet Q0 run is not successful')
          PY
          gh run download "$Q0_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "fleet-c3c-q0-image-${Q0_RUN_ID}" \
            --dir "${RUNNER_TEMP}/fleet-q0"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          candidates = list(Path(os.environ['RUNNER_TEMP'], 'fleet-q0').rglob('manifest.json'))
          if len(candidates) != 1:
              raise SystemExit('Fleet Q0 manifest is missing or ambiguous')
          manifest = json.loads(candidates[0].read_text(encoding='utf-8'))
          digest = manifest.get('image_digest')
          checks = (
              manifest.get('schema_version') == 'ets.fleet.c3c.q0_image.v1',
              manifest.get('source_sha') == os.environ['EXPECTED_SOURCE_SHA'],
              str(manifest.get('workflow_run_id')) == os.environ['Q0_RUN_ID'],
              manifest.get('immutable_image') == os.environ['FLEET_IMAGE'],
              manifest.get('vulnerability_gate') == 'PASS',
              manifest.get('registry_credentials_retained') is False,
              manifest.get('customer_identifiers_retained') is False,
              isinstance(digest, str) and re.fullmatch(r'sha256:[0-9a-f]{64}', digest) is not None,
              isinstance(digest, str) and os.environ['FLEET_IMAGE'].endswith('@' + digest),
          )
          if not all(checks):
              raise SystemExit('Fleet Q0 manifest failed exact-source deployment binding')
          evidence = {
              'schema_version': 'ets.fleet.c3d.q0_binding.v1',
              'source_sha': os.environ['EXPECTED_SOURCE_SHA'],
              'q0_workflow_run_id': int(os.environ['Q0_RUN_ID']),
              'immutable_fleet_image': os.environ['FLEET_IMAGE'],
              'image_digest': digest,
              'vulnerability_gate': 'PASS',
              'registry_credentials_retained': False,
              'customer_identifiers_retained': False,
          }
          Path('evidence/fleet-c3d/q0-binding.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Azure login using protected workload identity
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure tenant subscription resource group and private ACR posture
        shell: bash
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          ACR_NAME: ${{ inputs.container_registry_name }}
          ACR_RESOURCE_GROUP: ${{ inputs.container_registry_resource_group }}
        run: |
          set -euo pipefail
          active_subscription="$(az account show --query id -o tsv)"
          active_tenant="$(az account show --query tenantId -o tsv)"
          test "${active_subscription,,}" = "${EXPECTED_SUBSCRIPTION_ID,,}"
          test "${active_tenant,,}" = "${EXPECTED_TENANT_ID,,}"
          az group show --name "$RESOURCE_GROUP" --query id -o tsv >/dev/null
          admin_enabled="$(az acr show --name "$ACR_NAME" --resource-group "$ACR_RESOURCE_GROUP" --query adminUserEnabled -o tsv | tr '[:upper:]' '[:lower:]')"
          test "$admin_enabled" = 'false'
          arm_status="$(az acr config authentication-as-arm show --registry "$ACR_NAME" --resource-group "$ACR_RESOURCE_GROUP" --query status -o tsv | tr '[:upper:]' '[:lower:]')"
          test "$arm_status" = 'enabled'

      - name: Ensure governed Fleet Entra application and exact app roles
        id: entra
        shell: bash
        env:
          DISPLAY_NAME: ${{ inputs.entra_application_display_name }}
          APPLY: ${{ inputs.provision_entra_application }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import uuid
          from pathlib import Path

          roles = []
          for value, display, description in (
              ('Fleet.Viewer', 'Fleet Viewer', 'Read authorized Fleet control-plane objects.'),
              ('Fleet.Operator', 'Fleet Operator', 'Perform bounded Fleet operational mutations.'),
              ('Fleet.SecurityAdmin', 'Fleet Security Administrator', 'Perform step-up protected Fleet trust mutations.'),
          ):
              roles.append({
                  'allowedMemberTypes': ['User'],
                  'description': description,
                  'displayName': display,
                  'id': str(uuid.uuid5(uuid.NAMESPACE_URL, f'https://lanternprotocol.net/ets/fleet/{value}')),
                  'isEnabled': True,
                  'value': value,
              })
          Path('/tmp/fleet-app-roles.json').write_text(json.dumps(roles), encoding='utf-8')
          PY

          apps="$(az ad app list --display-name "$DISPLAY_NAME" --query '[].{appId:appId,signInAudience:signInAudience,appRoles:appRoles,web:web}' -o json)"
          app_count="$(APPS="$apps" python -c 'import json,os; print(len(json.loads(os.environ["APPS"])))')"
          if [ "$app_count" -gt 1 ]; then
            echo 'Multiple Entra applications use the governed Fleet display name.' >&2
            exit 1
          fi
          if [ "$app_count" -eq 0 ]; then
            test "$APPLY" = 'true' || { echo 'Governed Fleet Entra application is missing.' >&2; exit 1; }
            app="$(az ad app create --display-name "$DISPLAY_NAME" --sign-in-audience AzureADMyOrg --app-roles @/tmp/fleet-app-roles.json -o json)"
            app_id="$(APP="$app" python -c 'import json,os; print(json.loads(os.environ["APP"])["appId"])')"
            az ad app update --id "$app_id" --enable-id-token-issuance true --app-roles @/tmp/fleet-app-roles.json
          else
            app_id="$(APPS="$apps" python -c 'import json,os; print(json.loads(os.environ["APPS"])[0]["appId"])')"
            APP_JSON="$apps" ROLE_FILE=/tmp/fleet-app-roles.json python - <<'PY'
          import json
          import os
          from pathlib import Path

          app = json.loads(os.environ['APP_JSON'])[0]
          expected = json.loads(Path(os.environ['ROLE_FILE']).read_text())
          if app.get('signInAudience') != 'AzureADMyOrg':
              raise SystemExit('Fleet Entra application must remain single-tenant')
          actual = sorted(
              (r.get('value'), r.get('id'), r.get('isEnabled'), tuple(r.get('allowedMemberTypes') or []))
              for r in (app.get('appRoles') or [])
          )
          wanted = sorted((r['value'], r['id'], True, ('User',)) for r in expected)
          if actual and actual != wanted:
              raise SystemExit('Existing Fleet Entra app roles differ from governed contract')
          PY
            if [ "$APPLY" = 'true' ]; then
              az ad app update --id "$app_id" --enable-id-token-issuance true --app-roles @/tmp/fleet-app-roles.json
            fi
          fi

          service_principals="$(az ad sp list --filter "appId eq '$app_id'" -o json)"
          sp_count="$(SPS="$service_principals" python -c 'import json,os; print(len(json.loads(os.environ["SPS"])))')"
          if [ "$sp_count" -eq 0 ]; then
            test "$APPLY" = 'true' || { echo 'Fleet service principal is missing.' >&2; exit 1; }
            az ad sp create --id "$app_id" --only-show-errors -o none
          elif [ "$sp_count" -ne 1 ]; then
            echo 'Fleet service principal resolution is ambiguous.' >&2
            exit 1
          fi

          verified="$(az ad app show --id "$app_id" --query '{appId:appId,signInAudience:signInAudience,idTokens:web.implicitGrantSettings.enableIdTokenIssuance,appRoles:appRoles,passwordCredentials:passwordCredentials,keyCredentials:keyCredentials}' -o json)"
          VERIFIED="$verified" ROLE_FILE=/tmp/fleet-app-roles.json python - <<'PY'
          import json
          import os
          from pathlib import Path

          app = json.loads(os.environ['VERIFIED'])
          expected = json.loads(Path(os.environ['ROLE_FILE']).read_text())
          if app.get('signInAudience') != 'AzureADMyOrg' or app.get('idTokens') is not True:
              raise SystemExit('Fleet Entra app does not satisfy single-tenant ID-token contract')
          actual = sorted((r.get('value'), r.get('id'), r.get('isEnabled')) for r in app.get('appRoles') or [])
          wanted = sorted((r['value'], r['id'], True) for r in expected)
          if actual != wanted:
              raise SystemExit('Fleet Entra app role contract did not converge')
          if app.get('passwordCredentials') or app.get('keyCredentials'):
              raise SystemExit('C3D does not adopt an Entra app with reusable application credentials')
          PY
          echo "client_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "issuer=https://login.microsoftonline.com/${EXPECTED_TENANT_ID}/v2.0" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$app_id" > evidence/fleet-c3d/entra-client-id.txt

      - name: Deploy private C3B substrate and controlled migration job
        id: deploy
        shell: bash
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          ACR_NAME: ${{ inputs.container_registry_name }}
          ACR_RESOURCE_GROUP: ${{ inputs.container_registry_resource_group }}
          FLEET_IMAGE: ${{ inputs.fleet_image }}
          CLIENT_ID: ${{ steps.entra.outputs.client_id }}
          ISSUER: ${{ steps.entra.outputs.issuer }}
          HA_MODE: ${{ inputs.postgres_high_availability_mode }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "fleet-c3d-${GITHUB_RUN_ID}" \
            --template-file infra/azure/ets-fleet-c3d-live.bicep \
            --parameters \
              containerRegistryName="$ACR_NAME" \
              containerRegistryResourceGroup="$ACR_RESOURCE_GROUP" \
              fleetImage="$FLEET_IMAGE" \
              fleetEntraTenantId="$EXPECTED_TENANT_ID" \
              fleetEntraIssuer="$ISSUER" \
              fleetEntraAudience="$CLIENT_ID" \
              postgresHighAvailabilityMode="$HA_MODE" \
            --only-show-errors -o json > "${RUNNER_TEMP}/fleet-c3d-deployment.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ['RUNNER_TEMP'], 'fleet-c3d-deployment.json').read_text())
          outputs = payload['properties']['outputs']
          required = (
              'fleetContainerAppName', 'fleetPrivateOriginFqdn', 'managedEnvironmentName',
              'fleetRuntimeIdentityName', 'fleetRuntimeIdentityClientId',
              'fleetRuntimeIdentityPrincipalId', 'migrationIdentityName',
              'migrationJobName', 'postgresServerName', 'postgresPrivateFqdn',
              'fleetDatabaseName', 'immutableFleetImage', 'publicHostnameActivated',
          )
          for key in required:
              if key not in outputs:
                  raise SystemExit(f'missing C3D deployment output {key}')
          if outputs['publicHostnameActivated']['value'] is not False:
              raise SystemExit('C3D may not activate the public Fleet hostname')
          if outputs['immutableFleetImage']['value'] != os.environ['FLEET_IMAGE']:
              raise SystemExit('C3D deployment image differs from exact-source Q0 image')
          public = {key: outputs[key]['value'] for key in required}
          Path('evidence/fleet-c3d/deployment-outputs.json').write_text(
              json.dumps(public, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              for key, shell_name in (
                  ('fleetContainerAppName', 'app_name'),
                  ('fleetPrivateOriginFqdn', 'origin_fqdn'),
                  ('managedEnvironmentName', 'environment_name'),
                  ('fleetRuntimeIdentityName', 'runtime_identity_name'),
                  ('migrationJobName', 'migration_job_name'),
                  ('postgresServerName', 'postgres_name'),
              ):
                  handle.write(f"{shell_name}={public[key]}\n")
          PY

      - name: Run private Entra-only PostgreSQL bootstrap
        shell: bash
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          MIGRATION_JOB: ${{ steps.deploy.outputs.migration_job_name }}
        run: |
          set -euo pipefail
          execution="$(az containerapp job start --name "$MIGRATION_JOB" --resource-group "$RESOURCE_GROUP" --query name -o tsv)"
          test -n "$execution"
          status='Running'
          for _ in $(seq 1 90); do
            status="$(az containerapp job execution show --name "$MIGRATION_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution" --query properties.status -o tsv)"
            case "$status" in Succeeded|Failed|Canceled) break ;; esac
            sleep 5
          done
          az containerapp job logs show --name "$MIGRATION_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution" --container fleet-migration --tail 100 > evidence/fleet-c3d/migration.log 2>&1 || true
          printf 'execution=%s\nstatus=%s\n' "$execution" "$status" > evidence/fleet-c3d/migration-status.txt
          test "$status" = 'Succeeded'

      - name: Enable fail-closed EasyAuth bridge contract without public auth activation
        shell: bash
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          APP_NAME: ${{ steps.deploy.outputs.app_name }}
          STEP_UP_AUTH_CONTEXT_ID: ${{ inputs.step_up_auth_context_id }}
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --set-env-vars \
              ETS_FLEET_AUTH_BRIDGE=container-apps-easyauth \
              ETS_FLEET_STEP_UP_ACRS="$STEP_UP_AUTH_CONTEXT_ID" \
            --only-show-errors -o none

      - name: Deploy and run private readiness probe
        shell: bash
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          ENVIRONMENT_NAME: ${{ steps.deploy.outputs.environment_name }}
          ORIGIN_FQDN: ${{ steps.deploy.outputs.origin_fqdn }}
          RUNTIME_IDENTITY_NAME: ${{ steps.deploy.outputs.runtime_identity_name }}
          ACR_NAME: ${{ inputs.container_registry_name }}
          ACR_RESOURCE_GROUP: ${{ inputs.container_registry_resource_group }}
          FLEET_IMAGE: ${{ inputs.fleet_image }}
        run: |
          set -euo pipefail
          runtime_identity_id="$(az identity show --resource-group "$RESOURCE_GROUP" --name "$RUNTIME_IDENTITY_NAME" --query id -o tsv)"
          registry_server="$(az acr show --resource-group "$ACR_RESOURCE_GROUP" --name "$ACR_NAME" --query loginServer -o tsv)"
          job_name="ets-fleet-ready-${GITHUB_RUN_ID:0:12}"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "fleet-c3d-ready-${GITHUB_RUN_ID}" \
            --template-file infra/azure/ets-fleet-c3d-readiness.bicep \
            --parameters \
              managedEnvironmentName="$ENVIRONMENT_NAME" \
              fleetPrivateOriginFqdn="$ORIGIN_FQDN" \
              runtimeIdentityResourceId="$runtime_identity_id" \
              registryServer="$registry_server" \
              fleetImage="$FLEET_IMAGE" \
              readinessJobName="$job_name" \
            --only-show-errors -o none
          execution="$(az containerapp job start --name "$job_name" --resource-group "$RESOURCE_GROUP" --query name -o tsv)"
          status='Running'
          for _ in $(seq 1 60); do
            status="$(az containerapp job execution show --name "$job_name" --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution" --query properties.status -o tsv)"
            case "$status" in Succeeded|Failed|Canceled) break ;; esac
            sleep 5
          done
          az containerapp job logs show --name "$job_name" --resource-group "$RESOURCE_GROUP" --execution "$execution" --container fleet-readiness --tail 100 > evidence/fleet-c3d/readiness.log 2>&1 || true
          printf 'execution=%s\nstatus=%s\n' "$execution" "$status" > evidence/fleet-c3d/readiness-status.txt
          test "$status" = 'Succeeded'

      - name: Verify private production posture and retain C3C handoff
        shell: bash
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          APP_NAME: ${{ steps.deploy.outputs.app_name }}
          ENVIRONMENT_NAME: ${{ steps.deploy.outputs.environment_name }}
          POSTGRES_NAME: ${{ steps.deploy.outputs.postgres_name }}
          FLEET_IMAGE: ${{ inputs.fleet_image }}
          CLIENT_ID: ${{ steps.entra.outputs.client_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          Q0_RUN_ID: ${{ inputs.q0_workflow_run_id }}
        run: |
          set -euo pipefail
          az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" -o json > "${RUNNER_TEMP}/app.json"
          az containerapp env show --resource-group "$RESOURCE_GROUP" --name "$ENVIRONMENT_NAME" -o json > "${RUNNER_TEMP}/env.json"
          az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$POSTGRES_NAME" -o json > "${RUNNER_TEMP}/pg.json"
          python - <<'PY'
          import json
          import os
          import socket
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          app = json.loads((temp / 'app.json').read_text())
          env = json.loads((temp / 'env.json').read_text())
          pg = json.loads((temp / 'pg.json').read_text())
          app_props = app['properties']
          env_props = env['properties']
          pg_props = pg.get('properties') or pg
          containers = (app_props.get('template') or {}).get('containers') or []
          fleet = next(item for item in containers if item.get('name') == 'fleet-bff')
          scale = (app_props.get('template') or {}).get('scale') or {}
          if fleet.get('image') != os.environ['FLEET_IMAGE']:
              raise SystemExit('live Fleet app is not pinned to exact-source Q0 image')
          if scale.get('minReplicas') != 2 or int(scale.get('maxReplicas', 0)) < 2:
              raise SystemExit('live Fleet app is not configured for at least two replicas')
          if env_props.get('publicNetworkAccess') != 'Disabled':
              raise SystemExit('Fleet managed environment public network access is not disabled')
          if (env_props.get('vnetConfiguration') or {}).get('internal') is not True:
              raise SystemExit('Fleet managed environment is not internal')
          auth = pg_props.get('authConfig') or {}
          network = pg_props.get('network') or {}
          if auth.get('activeDirectoryAuth') != 'Enabled' or auth.get('passwordAuth') != 'Disabled':
              raise SystemExit('Fleet PostgreSQL is not Entra-only')
          if network.get('publicNetworkAccess') != 'Disabled':
              raise SystemExit('Fleet PostgreSQL public network access is not disabled')

          pg_host = pg_props.get('fullyQualifiedDomainName') or pg.get('fullyQualifiedDomainName')
          public_socket_denied = False
          if pg_host:
              try:
                  socket.create_connection((pg_host, 5432), timeout=3.0).close()
              except OSError:
                  public_socket_denied = True
          if not public_socket_denied:
              raise SystemExit('public GitHub runner unexpectedly reached Fleet PostgreSQL TCP')

          outputs = json.loads(Path('evidence/fleet-c3d/deployment-outputs.json').read_text())
          handoff = {
              'schema_version': 'ets.fleet.c3d.live_handoff.v1',
              'source_sha': os.environ['EXPECTED_SOURCE_SHA'],
              'q0_workflow_run_id': int(os.environ['Q0_RUN_ID']),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'immutable_fleet_image': os.environ['FLEET_IMAGE'],
              'resource_group': os.environ['RESOURCE_GROUP'],
              'container_app_name': app['name'],
              'managed_environment_name': env['name'],
              'postgres_server_name': pg['name'],
              'entra_client_id': os.environ['CLIENT_ID'],
              'migration_job_name': outputs['migrationJobName'],
              'runtime_identity_name': outputs['fleetRuntimeIdentityName'],
              'minimum_replicas': 2,
              'managed_environment_internal': True,
              'managed_environment_public_network_access': 'Disabled',
              'postgres_entra_auth': 'Enabled',
              'postgres_password_auth': 'Disabled',
              'postgres_public_network_access': 'Disabled',
              'public_database_tcp_denied_from_github_runner': True,
              'schema_bootstrap_succeeded': True,
              'private_readiness_succeeded': True,
              'easyauth_platform_activated': False,
              'public_hostname_activated': False,
              'evidence_verified': False,
              'health_asserted': False,
              'reusable_database_credential_retained': False,
          }
          Path('evidence/fleet-c3d/c3c-handoff.json').write_text(
              json.dumps(handoff, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(handoff, indent=2, sort_keys=True))
          PY

