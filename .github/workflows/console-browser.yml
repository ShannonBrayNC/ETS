name: Console Browser Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/console/**"
      - "tests/e2e/console/**"
      - ".github/workflows/console-browser.yml"

permissions:
  contents: read

jobs:
  browser-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/e2e/console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tests/e2e/console/package-lock.json
            apps/console/web/package-lock.json

      - name: Install locked Console dependencies
        run: npm ci --prefix ../../../apps/console/web --no-audit --no-fund

      - name: Install locked browser-test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Dark Pro connector browser qualification
        run: npm test

      - name: Upload browser qualification artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: console-browser-qualification
          path: |
            tests/e2e/console/playwright-report/
            tests/e2e/console/test-results/
          if-no-files-found: ignore
          retention-days: 30
