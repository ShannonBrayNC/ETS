name: Fleet C3C Live Qualification

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Compose the protected edge, or approve its exact Private Link request and qualify the default Front Door route."
        required: true
        type: choice
        options:
          - compose-edge
          - approve-and-qualify-route
      expected_source_sha:
        description: "Exact main/source SHA being qualified."
        required: true
        type: string
      fleet_image:
        description: "Immutable Fleet OCI image repository@sha256:digest from the protected Fleet Q0 publication; required for compose-edge."
        required: false
        type: string
      resource_group:
        description: "Azure resource group containing the Fleet C3B control plane."
        required: true
        default: "rg-ets-live-eastus"
        type: string
      container_app_name:
        description: "Exact Fleet C3B Container App name."
        required: true
        type: string
      managed_environment_name:
        description: "Exact Fleet C3B managed environment name."
        required: true
        type: string
      entra_client_id:
        description: "Single-tenant Fleet Entra application/client ID."
        required: true
        type: string
      entra_audience:
        description: "Exact audience enforced by the Fleet BFF."
        required: true
        type: string
      operator_group_ids_json:
        description: "JSON array of allowed Entra group object IDs."
        required: true
        type: string
      step_up_auth_context_id:
        description: "Microsoft Entra Conditional Access authentication-context ID required for Fleet SecurityAdmin step-up."
        required: true
        default: "c1"
        type: string
      auth_secret_setting_name:
        description: "Existing Azure-side EasyAuth client-secret setting name. The secret value is never read by this workflow."
        required: true
        default: "MICROSOFT_PROVIDER_AUTHENTICATION_SECRET"
        type: string
      frontdoor_profile_name:
        description: "Exact C3C Front Door profile name from compose-edge output; required for route qualification."
        required: false
        type: string
      frontdoor_endpoint_name:
        description: "Exact C3C Front Door endpoint name from compose-edge output; required for route qualification."
        required: false
        type: string
      private_link_connection_name:
        description: "Exact pending managed-environment Private Link connection name; required for approval."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  PRIVATE_LINK_REQUEST_MESSAGE: ETS Fleet C3C protected Front Door qualification origin.

jobs:
  qualify:
    name: ${{ inputs.phase }}
    runs-on: ubuntu-latest
    environment: ets-azure-q1
    timeout-minutes: 30

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate protected inputs
        shell: bash
        env:
          OPERATOR_GROUP_IDS_JSON: ${{ inputs.operator_group_ids_json }}
          FLEET_IMAGE: ${{ inputs.fleet_image }}
          STEP_UP_AUTH_CONTEXT_ID: ${{ inputs.step_up_auth_context_id }}
        run: |
          set -euo pipefail
          printf '%s' '${{ inputs.expected_source_sha }}' | grep -Eq '^[0-9a-f]{40}$'
          test "${GITHUB_SHA}" = '${{ inputs.expected_source_sha }}'
          test -n '${{ inputs.resource_group }}'
          test -n '${{ inputs.container_app_name }}'
          test -n '${{ inputs.managed_environment_name }}'
          test -n '${{ inputs.entra_client_id }}'
          test -n '${{ inputs.entra_audience }}'
          test -n '${{ inputs.auth_secret_setting_name }}'
          printf '%s' "${STEP_UP_AUTH_CONTEXT_ID}" | grep -Eq '^c[0-9]{1,2}$'
          python - <<'PY'
          import json
          import os

          values = json.loads(os.environ['OPERATOR_GROUP_IDS_JSON'])
          assert isinstance(values, list) and values
          assert all(isinstance(item, str) and len(item) == 36 for item in values)
          assert len(values) == len(set(values))
          PY
          case '${{ inputs.phase }}' in
            compose-edge)
              test -n "${FLEET_IMAGE}"
              printf '%s' "${FLEET_IMAGE}" | grep -Eq '^[^[:space:]]+@sha256:[0-9a-f]{64}$'
              ;;
            approve-and-qualify-route)
              test -n '${{ inputs.frontdoor_profile_name }}'
              test -n '${{ inputs.frontdoor_endpoint_name }}'
              test -n '${{ inputs.private_link_connection_name }}'
              ;;
            *) exit 2 ;;
          esac

      - name: Azure login using protected workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify exact Azure tenant subscription and private Fleet origin
        id: origin
        shell: bash
        env:
          EXPECTED_APP: ${{ inputs.container_app_name }}
          EXPECTED_ENV: ${{ inputs.managed_environment_name }}
        run: |
          set -euo pipefail
          active_subscription="$(az account show --query id -o tsv)"
          active_tenant="$(az account show --query tenantId -o tsv)"
          test "${active_subscription,,}" = "${EXPECTED_SUBSCRIPTION_ID,,}"
          test "${active_tenant,,}" = "${EXPECTED_TENANT_ID,,}"

          az containerapp show \
            --resource-group '${{ inputs.resource_group }}' \
            --name '${{ inputs.container_app_name }}' \
            --query '{name:name,environmentId:properties.environmentId,fqdn:properties.configuration.ingress.fqdn}' \
            -o json > "${RUNNER_TEMP}/fleet-app.json"
          az containerapp env show \
            --resource-group '${{ inputs.resource_group }}' \
            --name '${{ inputs.managed_environment_name }}' \
            --query '{name:name,id:id,publicNetworkAccess:properties.publicNetworkAccess,internal:properties.vnetConfiguration.internal}' \
            -o json > "${RUNNER_TEMP}/fleet-env.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          app = json.loads((root / 'fleet-app.json').read_text())
          env = json.loads((root / 'fleet-env.json').read_text())
          assert app['name'] == os.environ['EXPECTED_APP']
          assert env['name'] == os.environ['EXPECTED_ENV']
          assert app['environmentId'].lower() == env['id'].lower()
          assert env['publicNetworkAccess'] == 'Disabled'
          assert env['internal'] is True
          assert app['fqdn']
          print(app['fqdn'])
          PY
          origin_fqdn="$(python -c "import json,os;print(json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'fleet-app.json')))['fqdn'])")"
          echo "origin_fqdn=${origin_fqdn}" >> "$GITHUB_OUTPUT"

      - name: Require EasyAuth confidential-client secret to exist only in Azure
        shell: bash
        run: |
          set -euo pipefail
          secret_name='${{ inputs.auth_secret_setting_name }}'
          match="$(az containerapp secret list \
            --resource-group '${{ inputs.resource_group }}' \
            --name '${{ inputs.container_app_name }}' \
            --query "[?name=='${secret_name}'].name | [0]" \
            -o tsv)"
          test "${match}" = "${secret_name}"
          echo "Required EasyAuth secret setting exists in Azure; value was not read."

      - name: Deploy exact immutable C3C Fleet runtime configuration
        if: inputs.phase == 'compose-edge'
        shell: bash
        env:
          FLEET_IMAGE: ${{ inputs.fleet_image }}
          STEP_UP_AUTH_CONTEXT_ID: ${{ inputs.step_up_auth_context_id }}
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group '${{ inputs.resource_group }}' \
            --name '${{ inputs.container_app_name }}' \
            --image "${FLEET_IMAGE}" \
            --set-env-vars \
              ETS_FLEET_AUTH_BRIDGE=container-apps-easyauth \
              ETS_FLEET_STEP_UP_ACRS="${STEP_UP_AUTH_CONTEXT_ID}" \
            --only-show-errors \
            -o none

          az containerapp show \
            --resource-group '${{ inputs.resource_group }}' \
            --name '${{ inputs.container_app_name }}' \
            --query "properties.template.containers[?name=='fleet-bff'] | [0].{image:image,env:env}" \
            -o json > "${RUNNER_TEMP}/fleet-runtime.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          runtime = json.loads(
              Path(os.environ['RUNNER_TEMP'], 'fleet-runtime.json').read_text()
          )
          assert runtime['image'] == os.environ['FLEET_IMAGE']
          env = {
              item['name']: item.get('value')
              for item in runtime.get('env', [])
              if isinstance(item, dict) and item.get('name')
          }
          assert env['ETS_FLEET_AUTH_BRIDGE'] == 'container-apps-easyauth'
          assert env['ETS_FLEET_STEP_UP_ACRS'] == os.environ['STEP_UP_AUTH_CONTEXT_ID']
          PY

      - name: Compose EasyAuth Front Door Premium WAF Private Link boundary
        id: compose
        if: inputs.phase == 'compose-edge'
        shell: bash
        env:
          FLEET_IMAGE: ${{ inputs.fleet_image }}
          STEP_UP_AUTH_CONTEXT_ID: ${{ inputs.step_up_auth_context_id }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group '${{ inputs.resource_group }}' \
            --name "fleet-c3c-edge-${GITHUB_RUN_ID}" \
            --template-file infra/azure/ets-fleet-c3c-frontdoor.bicep \
            --parameters \
              containerAppName='${{ inputs.container_app_name }}' \
              managedEnvironmentName='${{ inputs.managed_environment_name }}' \
              entraTenantId="${EXPECTED_TENANT_ID}" \
              entraClientId='${{ inputs.entra_client_id }}' \
              entraAudience='${{ inputs.entra_audience }}' \
              operatorGroupObjectIds='${{ inputs.operator_group_ids_json }}' \
              entraClientSecretSettingName='${{ inputs.auth_secret_setting_name }}' \
            --only-show-errors \
            -o json > "${RUNNER_TEMP}/fleet-c3c-deployment.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ['RUNNER_TEMP'], 'fleet-c3c-deployment.json').read_text()
          )
          outputs = payload['properties']['outputs']
          assert outputs['privateLinkApprovalRequired']['value'] is True
          assert outputs['wafMode']['value'] == 'Prevention'
          assert outputs['authenticationProvider']['value'] == 'MicrosoftEntraID'
          assert outputs['tokenStoreEnabled']['value'] is False
          assert outputs['defaultDomainQualificationEnabled']['value'] is True
          assert outputs['publicHostnameActivated']['value'] is False
          public = {
              'schema_version': 'ets.fleet.c3c.compose.v1',
              'source_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'fleet_image': os.environ['FLEET_IMAGE'],
              'step_up_auth_context_id': os.environ['STEP_UP_AUTH_CONTEXT_ID'],
              'front_door_profile': outputs['frontDoorProfileName']['value'],
              'front_door_endpoint': outputs['frontDoorEndpointName']['value'],
              'front_door_host': outputs['frontDoorEndpointHostName']['value'],
              'private_link_target_id': outputs['privateLinkTargetId']['value'],
              'private_link_approval_required': True,
              'waf_mode': 'Prevention',
              'token_store_enabled': False,
              'public_hostname_activated': False,
              'claim_state': {
                  'software_composed': True,
                  'shared_store_qualified': False,
                  'entra_enforced': False,
                  'azure_private_origin_qualified': False,
                  'frontdoor_route_qualified': False,
                  'public_hostname_tls_qualified': False,
                  'live_fleet_mutation_qualified': False,
              },
          }
          path = Path('evidence/fleet-c3c')
          path.mkdir(parents=True, exist_ok=True)
          (path / 'compose.json').write_text(
              json.dumps(public, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(public, indent=2))
          PY

      - name: Inspect exact pending Private Link connection
        if: inputs.phase == 'approve-and-qualify-route'
        shell: bash
        run: |
          set -euo pipefail
          az network private-endpoint-connection list \
            --name '${{ inputs.managed_environment_name }}' \
            --resource-group '${{ inputs.resource_group }}' \
            --type Microsoft.App/managedEnvironments \
            -o json > "${RUNNER_TEMP}/fleet-private-links.json"

          CONNECTION_NAME='${{ inputs.private_link_connection_name }}' python - <<'PY'
          import json
          import os
          from pathlib import Path

          items = json.loads(
              Path(os.environ['RUNNER_TEMP'], 'fleet-private-links.json').read_text()
          )
          name = os.environ['CONNECTION_NAME']
          exact = [item for item in items if item.get('name') == name]
          assert len(exact) == 1
          item = exact[0]
          state = item['properties']['privateLinkServiceConnectionState']
          assert state['status'] == 'Pending'
          assert state.get('description') == os.environ['PRIVATE_LINK_REQUEST_MESSAGE']
          assert item.get('id')
          Path(os.environ['RUNNER_TEMP'], 'fleet-private-link-id.txt').write_text(
              item['id'], encoding='utf-8'
          )
          PY

      - name: Approve only the reviewed C3C Private Link request
        if: inputs.phase == 'approve-and-qualify-route'
        shell: bash
        run: |
          set -euo pipefail
          connection_id="$(cat "${RUNNER_TEMP}/fleet-private-link-id.txt")"
          az network private-endpoint-connection approve \
            --id "${connection_id}" \
            --description 'Approved by protected ETS Fleet C3C qualification.' \
            --only-show-errors \
            -o none
          status="$(az network private-endpoint-connection show \
            --id "${connection_id}" \
            --query properties.privateLinkServiceConnectionState.status \
            -o tsv)"
          test "${status}" = 'Approved'

      - name: Qualify default Front Door route and prove direct-origin denial
        if: inputs.phase == 'approve-and-qualify-route'
        shell: bash
        env:
          ORIGIN_FQDN: ${{ steps.origin.outputs.origin_fqdn }}
        run: |
          set -euo pipefail
          endpoint_host="$(az afd endpoint show \
            --resource-group '${{ inputs.resource_group }}' \
            --profile-name '${{ inputs.frontdoor_profile_name }}' \
            --endpoint-name '${{ inputs.frontdoor_endpoint_name }}' \
            --query hostName -o tsv)"
          test -n "${endpoint_host}"

          if curl --fail --silent --show-error --max-time 10 \
            "https://${ORIGIN_FQDN}/fleet/readyz" >/dev/null 2>&1; then
            echo 'Direct Fleet private-origin access unexpectedly succeeded.' >&2
            exit 1
          fi

          ready_file="${RUNNER_TEMP}/fleet-ready.json"
          ready_ok=false
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 15 \
              "https://${endpoint_host}/fleet/readyz" -o "${ready_file}"; then
              if READY_FILE="${ready_file}" python - <<'PY'
          import json
          import os

          payload = json.load(open(os.environ['READY_FILE'], encoding='utf-8'))
          assert payload['ready'] is True
          assert payload['process_ready'] is True
          assert payload['auth_config_ready'] is True
          assert payload['store_ready'] is True
          assert payload['evidence_verified'] is False
          assert payload['health_asserted'] is False
          PY
              then
                ready_ok=true
                break
              fi
            fi
            sleep 15
          done
          test "${ready_ok}" = true

          portal_status="$(curl --silent --output /dev/null --max-time 15 \
            --write-out '%{http_code}' "https://${endpoint_host}/fleet")"
          case "${portal_status}" in
            302|303|307|401|403) ;;
            *)
              echo "Anonymous Fleet request was not blocked by EasyAuth: ${portal_status}" >&2
              exit 1
              ;;
          esac

          mkdir -p evidence/fleet-c3c
          ENDPOINT_HOST="${endpoint_host}" PORTAL_STATUS="${portal_status}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          public = {
              'schema_version': 'ets.fleet.c3c.route-qualification.v1',
              'source_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'front_door_host': os.environ['ENDPOINT_HOST'],
              'private_link_status': 'Approved',
              'direct_origin_public_access': False,
              'anonymous_portal_http_status': int(os.environ['PORTAL_STATUS']),
              'readiness': {
                  'process_ready': True,
                  'auth_config_ready': True,
                  'store_ready': True,
                  'evidence_verified': False,
                  'health_asserted': False,
              },
              'public_hostname_activated': False,
              'claim_state': {
                  'software_composed': True,
                  'shared_store_qualified': False,
                  'entra_enforced': False,
                  'azure_private_origin_qualified': True,
                  'frontdoor_route_qualified': True,
                  'public_hostname_tls_qualified': False,
                  'live_fleet_mutation_qualified': False,
              },
          }
          path = Path('evidence/fleet-c3c/route-qualification.json')
          path.write_text(
              json.dumps(public, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(public, indent=2))
          PY

      - name: Upload public-safe C3C evidence
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fleet-c3c-${{ inputs.phase }}-${{ github.run_id }}
          path: evidence/fleet-c3c/
          if-no-files-found: error
