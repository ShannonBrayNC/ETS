name: Fleet Azure DPS Live Qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DPS_NAME: ${{ vars.ETS_FLEET_DPS_NAME }}
  DPS_RESOURCE_GROUP: ${{ vars.ETS_FLEET_DPS_RESOURCE_GROUP }}

jobs:
  virtual-x509:
    name: Virtual Demo X.509 control-plane qualification
    runs-on: ubuntu-24.04
    environment: fleet-azure
    timeout-minutes: 30

    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require merged main and protected target variables
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -n "${DPS_NAME}"
          test -n "${DPS_RESOURCE_GROUP}"
          mkdir -p evidence/fleet-azure-dps

      - name: Azure login using GitHub OIDC
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install pinned Azure IoT CLI extension
        shell: bash
        run: |
          set -euo pipefail
          az extension add \
            --name azure-iot \
            --version 0.30.0 \
            --yes \
            --only-show-errors
          test "$(az extension show --name azure-iot --query version -o tsv)" = "0.30.0"

      - name: Verify exact DPS target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          active_subscription="$(az account show --query id -o tsv)"
          test "${active_subscription,,}" = "${AZURE_SUBSCRIPTION_ID,,}"
          dps_json="$(az iot dps show \
            --name "${DPS_NAME}" \
            --resource-group "${DPS_RESOURCE_GROUP}" \
            --query '{id:id,name:name,resourceGroup:resourceGroup}' \
            -o json)"
          printf '%s\n' "${dps_json}" > "${RUNNER_TEMP}/dps.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "dps.json").read_text())
          assert payload["name"] == os.environ["DPS_NAME"]
          assert payload["resourceGroup"] == os.environ["DPS_RESOURCE_GROUP"]
          assert payload["id"].split("/")[2].lower() == os.environ["AZURE_SUBSCRIPTION_ID"].lower()
          PY
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create ephemeral Virtual Demo X.509 public identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/fleet-virtual-demo.key.pem"
          cert_file="${RUNNER_TEMP}/fleet-virtual-demo.cert.pem"
          openssl genpkey \
            -algorithm EC \
            -pkeyopt ec_paramgen_curve:P-256 \
            -out "${key_file}" >/dev/null 2>&1
          public_fingerprint="$(openssl pkey \
            -in "${key_file}" \
            -pubout \
            -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
          registration_id="ets-edge:${public_fingerprint:0:24}"
          openssl req \
            -new \
            -x509 \
            -sha256 \
            -key "${key_file}" \
            -out "${cert_file}" \
            -days 1 \
            -subj "/CN=${registration_id}" \
            -addext "extendedKeyUsage=clientAuth" >/dev/null 2>&1
          certificate_thumbprint="$(openssl x509 \
            -in "${cert_file}" \
            -outform DER | sha256sum | awk '{print $1}')"
          subject_cn="$(openssl x509 \
            -in "${cert_file}" \
            -noout \
            -subject \
            -nameopt RFC2253 | sed -n 's/^subject=CN=//p')"
          test "${subject_cn}" = "${registration_id}"
          test "${#registration_id}" -le 64
          printf 'registration_id=%s\n' "${registration_id}" >> "${GITHUB_OUTPUT}"
          printf 'public_fingerprint=%s\n' "${public_fingerprint}" >> "${GITHUB_OUTPUT}"
          printf 'certificate_thumbprint=%s\n' "${certificate_thumbprint}" >> "${GITHUB_OUTPUT}"
          printf 'certificate_path=%s\n' "${cert_file}" >> "${GITHUB_OUTPUT}"
          printf 'private_key_path=%s\n' "${key_file}" >> "${GITHUB_OUTPUT}"

      - name: Create disabled individual enrollment using Entra data-plane auth
        id: create
        shell: bash
        run: |
          set -euo pipefail
          az iot dps enrollment create \
            --auth-type login \
            --resource-group "${DPS_RESOURCE_GROUP}" \
            --dps-name "${DPS_NAME}" \
            --enrollment-id '${{ steps.identity.outputs.registration_id }}' \
            --device-id '${{ steps.identity.outputs.registration_id }}' \
            --attestation-type x509 \
            --certificate-path '${{ steps.identity.outputs.certificate_path }}' \
            --provisioning-status disabled \
            -o json > "${RUNNER_TEMP}/created.json"
          printf 'created=true\n' >> "${GITHUB_OUTPUT}"

      - name: Verify disabled staging without retaining provider payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "created.json").read_text())
          assert payload["registrationId"] == os.environ["REGISTRATION_ID"]
          assert payload["deviceId"] == os.environ["REGISTRATION_ID"]
          assert payload["provisioningStatus"].lower() == "disabled"
          assert payload["attestation"]["type"].lower() == "x509"
          PY
          rm -f "${RUNNER_TEMP}/created.json"
        env:
          REGISTRATION_ID: ${{ steps.identity.outputs.registration_id }}

      - name: Enable then disable enrollment through Entra data-plane auth
        shell: bash
        run: |
          set -euo pipefail
          for desired in enabled disabled; do
            az iot dps enrollment update \
              --auth-type login \
              --resource-group "${DPS_RESOURCE_GROUP}" \
              --dps-name "${DPS_NAME}" \
              --enrollment-id '${{ steps.identity.outputs.registration_id }}' \
              --provisioning-status "${desired}" \
              -o none
            actual="$(az iot dps enrollment show \
              --auth-type login \
              --resource-group "${DPS_RESOURCE_GROUP}" \
              --dps-name "${DPS_NAME}" \
              --enrollment-id '${{ steps.identity.outputs.registration_id }}' \
              --show-keys false \
              --query provisioningStatus \
              -o tsv | tr '[:upper:]' '[:lower:]')"
            test "${actual}" = "${desired}"
          done

      - name: Delete qualification enrollment
        if: always() && steps.create.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          az iot dps enrollment delete \
            --auth-type login \
            --resource-group "${DPS_RESOURCE_GROUP}" \
            --dps-name "${DPS_NAME}" \
            --enrollment-id '${{ steps.identity.outputs.registration_id }}' \
            --only-show-errors

      - name: Emit public-safe qualification manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": "ets.fleet.azure-dps.live-qualification.v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "dps_name": os.environ["DPS_NAME"],
              "dps_resource_group": os.environ["DPS_RESOURCE_GROUP"],
              "registration_id": os.environ["REGISTRATION_ID"],
              "device_id": os.environ["REGISTRATION_ID"],
              "profile": "virtual_demo",
              "auth_method": "x509",
              "key_custody": "software_demo",
              "hardware_attested": False,
              "public_key_fingerprint_sha256": os.environ["PUBLIC_FINGERPRINT"],
              "certificate_thumbprint_sha256": os.environ["CERTIFICATE_THUMBPRINT"],
              "provider_state_sequence": ["disabled", "enabled", "disabled", "deleted"],
              "azure_authentication": "github_oidc_entra",
              "dps_data_authentication": "login",
              "credentials_retained": False,
              "private_key_retained": False,
              "raw_certificate_retained": False,
              "customer_identifiers_retained": False,
          }
          path = Path("evidence/fleet-azure-dps/live-qualification.json")
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
        env:
          REGISTRATION_ID: ${{ steps.identity.outputs.registration_id }}
          PUBLIC_FINGERPRINT: ${{ steps.identity.outputs.public_fingerprint }}
          CERTIFICATE_THUMBPRINT: ${{ steps.identity.outputs.certificate_thumbprint }}

      - name: Remove ephemeral certificate and private key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            '${{ steps.identity.outputs.private_key_path }}' \
            '${{ steps.identity.outputs.certificate_path }}' \
            "${RUNNER_TEMP}/created.json"

      - name: Upload sanitized live qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: fleet-azure-dps-live-${{ github.run_id }}
          path: evidence/fleet-azure-dps/live-qualification.json
          if-no-files-found: error
          retention-days: 30
