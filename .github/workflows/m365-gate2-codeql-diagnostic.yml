name: M365 Gate 2 CodeQL Diagnostic

on:
  push:
    branches:
      - migration/m365-cross-tenant-gate2-preview
    paths:
      - '.github/workflows/m365-gate2-codeql-diagnostic.yml'

permissions:
  contents: read
  security-events: read

jobs:
  codeql-alert:
    name: Read sanitized CodeQL alert metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read PR 632 open CodeQL alert metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/${{ github.repository }}/code-scanning/alerts?pr=632&state=open&tool_name=CodeQL' \
            --jq '.[] | {number, rule_id: .rule.id, rule_name: .rule.name, security_severity: .rule.security_severity_level, path: .most_recent_instance.location.path, start_line: .most_recent_instance.location.start_line, state}'
