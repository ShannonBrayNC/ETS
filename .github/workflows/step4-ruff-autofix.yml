name: Step 4 Ruff Autofix

on:
  push:
    branches:
      - demo/p0-ranger-r0-consequence-closure

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/p0-ranger-r0-consequence-closure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.8,<1'
      - name: Fix import ordering and remove temporary workflow
        run: |
          ruff check --fix ets/ranger/agent365_r0_evidence.py
          git rm .github/workflows/step4-ruff-autofix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ets/ranger/agent365_r0_evidence.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix Step 4 import ordering'
            git push origin HEAD:demo/p0-ranger-r0-consequence-closure
          fi
