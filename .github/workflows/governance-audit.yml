name: Governance Audit

# Scheduled governance audits are paused while the dissertation-only program is
# active. Keep manual dispatch available for an explicit security/governance review.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-protection:
    name: Branch protection drift audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify live branch protection
        env:
          ETS_VERIFY_LIVE_BRANCH_PROTECTION: "1"
          BRANCH_PROTECTION_AUDIT_TOKEN: ${{ secrets.BRANCH_PROTECTION_AUDIT_TOKEN }}
        run: |
          if [ -z "$BRANCH_PROTECTION_AUDIT_TOKEN" ]; then
            echo "::error::Configure repository secret BRANCH_PROTECTION_AUDIT_TOKEN with branch-protection read access before governance audits can pass."
            exit 1
          fi

          GITHUB_TOKEN="$BRANCH_PROTECTION_AUDIT_TOKEN" python scripts/verify-branch-protection-runbook.py
