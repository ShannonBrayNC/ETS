name: Read Lantern Front Door Endpoint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lantern-frontdoor-readback.yml'

permissions:
  contents: read
  id-token: write

jobs:
  readback:
    name: Read public Front Door hostname
    runs-on: ubuntu-latest
    environment: ets-azure-q1
    timeout-minutes: 8
    env:
      RESOURCE_GROUP: rg-ets-live-eastus
      PROFILE_NAME: lantern-continuity-fd
    steps:
      - name: Azure login with ETS workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Front Door CLI extension
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name cdn --upgrade --yes --only-show-errors

      - name: Read public endpoint
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t endpoints < <(az afd endpoint list -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --query '[].name' -o tsv)
          test "${#endpoints[@]}" -eq 1
          endpoint_name="${endpoints[0]}"
          afd_host="$(az afd endpoint show -g "$RESOURCE_GROUP" --profile-name "$PROFILE_NAME" --endpoint-name "$endpoint_name" --query hostName -o tsv)"
          test -n "$afd_host"
          printf 'LANTERN_FRONTDOOR_ENDPOINT_NAME=%s\n' "$endpoint_name"
          printf 'LANTERN_FRONTDOOR_PUBLIC_HOST=%s\n' "$afd_host"
