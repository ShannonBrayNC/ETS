name: Live SharePoint Relay Recovery

on:
  workflow_dispatch:
    inputs:
      image_source_sha:
        description: Exact candidate source SHA that produced the deployed immutable image
        required: true
        type: string
      container_image:
        description: Exact private ACR image as registry/repository@sha256:<digest>
        required: true
        type: string
      fault_stage_workflow_run_id:
        description: Successful bounded SharePoint relay fault-stage workflow run ID
        required: true
        type: string
      marker:
        description: Synthetic qualification marker already present in /sites/ETS Documents
        required: true
        default: post458-release-sync-20260820
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: live-sharepoint-relay-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Reconcile verified SharePoint relay state and collection gap
    runs-on: ubuntu-24.04
    environment: ets-azure-q1
    timeout-minutes: 15
    env:
      AZURE_CORE_ONLY_SHOW_ERRORS: "true"
      LOCATION: eastus
      RESOURCE_GROUP: rg-ets-live-eastus
      GATEWAY_APP: ets-o23bf2d6oq44s-gw
      GATEWAY_IDENTITY_NAME: ets-o23bf2d6oq44s-gw-id
      ACR_NAME: etsq1a352eb89
      IMAGE_SOURCE_SHA: ${{ inputs.image_source_sha }}
      CONTAINER_IMAGE: ${{ inputs.container_image }}
      FAULT_STAGE_RUN_ID: ${{ inputs.fault_stage_workflow_run_id }}

    steps:
      - name: Check out recovery source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert protected recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$IMAGE_SOURCE_SHA" = "$GITHUB_SHA"
          test -f infra/azure/ets-live-sharepoint-relay-recovery.bicep
          test -n "${{ inputs.marker }}"
          python - <<'PY'
          import os
          import re

          if re.fullmatch(r"[0-9a-f]{40}", os.environ["IMAGE_SOURCE_SHA"]) is None:
              raise SystemExit("image_source_sha is not a canonical commit SHA")
          if re.fullmatch(r"[1-9][0-9]*", os.environ["FAULT_STAGE_RUN_ID"]) is None:
              raise SystemExit("fault_stage_workflow_run_id is not canonical")
          image = os.environ["CONTAINER_IMAGE"]
          registry = re.escape(os.environ["ACR_NAME"] + ".azurecr.io")
          if re.fullmatch(rf"{registry}/[^@\s]+@sha256:[0-9a-f]{{64}}", image) is None:
              raise SystemExit("container_image is outside the exact private-ACR digest boundary")
          PY

      - name: Validate exact bounded fault-stage workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/fault-stage-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAULT_STAGE_RUN_ID" > "$payload"
          python - "$payload" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "head_sha": os.environ["GITHUB_SHA"],
              "head_branch": "main",
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "path": ".github/workflows/live-sharepoint-relay-fault-stage.yml",
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f"fault-stage workflow mismatch for {key}")
          PY
          rm -f "$payload"

      - name: Download exact bounded fault-stage evidence
        uses: actions/download-artifact@v8.0.1
        with:
          name: live-sharepoint-relay-fault-stage-${{ inputs.fault_stage_workflow_run_id }}
          path: evidence/relay-recovery/fault-stage
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.fault_stage_workflow_run_id }}

      - name: Validate exact bounded fault-stage evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("evidence/relay-recovery/fault-stage/result.json")
          if not path.is_file():
              raise SystemExit("bounded relay fault-stage evidence is missing")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("schema_version") != "ets.live_sharepoint.relay_fault_stage.v1":
              raise SystemExit("bounded relay fault-stage schema changed")
          if payload.get("workflow_run_id") != int(os.environ["FAULT_STAGE_RUN_ID"]):
              raise SystemExit("fault-stage artifact run identity changed")
          if payload.get("source_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("fault-stage source differs from recovery source")
          digest = os.environ["CONTAINER_IMAGE"].rsplit("@", 1)[1]
          if payload.get("image_digest") != digest:
              raise SystemExit("fault-stage image differs from recovery image")
          for key in (
              "stage_pass", "queue_state_mutated", "connector_runtime_mutated",
              "gap_open_after", "observation_collection_gap_after", "public_evidence_safe",
          ):
              if payload.get(key) is not True:
                  raise SystemExit("fault-stage predicate failed: " + key)
          for key in (
              "lease_active_after", "core_state_mutated", "customer_identifiers_retained",
              "event_identifiers_retained", "event_hashes_retained", "core_payload_retained",
              "reusable_credential_retained", "m365_source_to_proof_claimed", "soak_clock_started",
          ):
              if payload.get(key) is not False:
                  raise SystemExit("fault-stage fail-closed boundary failed: " + key)
          if payload.get("terminal_total_after") != 1 or payload.get("marker_terminal_after") != 1:
              raise SystemExit("fault-stage did not isolate exactly one synthetic marker terminal row")
          if payload.get("retryable_after") != 0 or payload.get("core_present_match") != 1:
              raise SystemExit("fault-stage recovery prerequisites are incomplete")
          PY

      - name: Azure login with workload identity
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes --only-show-errors

      - name: Run controlled relay and gap recovery
        shell: bash
        env:
          MARKER: ${{ inputs.marker }}
        run: |
          set -euo pipefail
          mkdir -p evidence/live-sharepoint-relay-recovery

          if ! [[ "$MARKER" =~ ^[a-z0-9][a-z0-9-]{5,31}$ ]]; then
            echo "::error::marker is outside the public-safe profile"
            exit 1
          fi

          job_name="ets-sp-recover-${GITHUB_RUN_ID}"
          job_name="${job_name:0:32}"
          cleanup() {
            az containerapp job delete \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --yes \
              --only-show-errors >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gateway_json="$RUNNER_TEMP/sharepoint-recovery-gateway.json"
          az containerapp show \
            --name "$GATEWAY_APP" \
            --resource-group "$RESOURCE_GROUP" \
            -o json > "$gateway_json"

          runtime_identity_id="$(az identity show \
            --name "$GATEWAY_IDENTITY_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id -o tsv)"
          runtime_client_id="$(az identity show \
            --name "$GATEWAY_IDENTITY_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query clientId -o tsv)"
          test -n "$runtime_identity_id"
          test -n "$runtime_client_id"
          echo "::add-mask::$runtime_client_id"

          resolved="$RUNNER_TEMP/sharepoint-recovery-resolved.txt"
          python - "$gateway_json" > "$resolved" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          gateway = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          props = gateway.get("properties") or {}
          template = props.get("template") or {}
          containers = template.get("containers") or []
          if len(containers) != 1 or containers[0].get("name") != "ets-gateway":
              raise SystemExit("live Gateway container identity changed")
          container = containers[0]
          environment_id = str(props.get("environmentId") or "")
          image = str(container.get("image") or "")
          if image != os.environ["CONTAINER_IMAGE"]:
              raise SystemExit("live Gateway image differs from the exact recovery candidate")
          registries = (props.get("configuration") or {}).get("registries") or []
          if len(registries) != 1:
              raise SystemExit("live Gateway must expose exactly one registry binding")
          pull_identity = str(registries[0].get("identity") or "")
          volumes = template.get("volumes") or []
          state = [item for item in volumes if item.get("name") == "gateway-state"]
          if len(state) != 1:
              raise SystemExit("live Gateway state volume is unavailable")
          storage_name = str(state[0].get("storageName") or "")

          env = {}
          for item in container.get("env") or []:
              name = item.get("name")
              if name in {
                  "ETS_GATEWAY_CORE_BASE_URL",
                  "ETS_GATEWAY_CORE_SCOPE",
                  "ETS_GATEWAY_TENANT_ID",
                  "ETS_GATEWAY_WORKSPACE_ID",
                  "ETS_GATEWAY_INSTANCE_ID",
              }:
                  value = item.get("value")
                  if not isinstance(value, str) or not value:
                      raise SystemExit("required recovery setting is not a plain bounded value: " + str(name))
                  env[name] = value
          required = {
              "ETS_GATEWAY_CORE_BASE_URL",
              "ETS_GATEWAY_CORE_SCOPE",
              "ETS_GATEWAY_TENANT_ID",
              "ETS_GATEWAY_WORKSPACE_ID",
              "ETS_GATEWAY_INSTANCE_ID",
          }
          if set(env) != required:
              raise SystemExit("live Gateway recovery settings are incomplete")
          if env["ETS_GATEWAY_INSTANCE_ID"] != "m365-sharepoint-primary":
              raise SystemExit("live Gateway connector instance changed")
          if not environment_id or not pull_identity or not storage_name:
              raise SystemExit("live Gateway recovery prerequisites are incomplete")

          print("ENVIRONMENT_ID=" + environment_id)
          print("PULL_IDENTITY=" + pull_identity)
          print("STATE_STORAGE_NAME=" + storage_name)
          print("CORE_BASE_URL=" + env["ETS_GATEWAY_CORE_BASE_URL"])
          print("CORE_SCOPE=" + env["ETS_GATEWAY_CORE_SCOPE"])
          print("TENANT_ID=" + env["ETS_GATEWAY_TENANT_ID"])
          print("WORKSPACE_ID=" + env["ETS_GATEWAY_WORKSPACE_ID"])
          print("INSTANCE_ID=" + env["ETS_GATEWAY_INSTANCE_ID"])
          PY

          while IFS='=' read -r key value; do
            test -n "$key"
            test -n "$value"
            printf -v "$key" '%s' "$value"
          done < "$resolved"
          rm -f "$gateway_json" "$resolved"
          echo "::add-mask::$TENANT_ID"
          echo "::add-mask::$WORKSPACE_ID"

          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/ets-live-sharepoint-relay-recovery.bicep \
            --parameters \
              location="$LOCATION" \
              jobName="$job_name" \
              managedEnvironmentResourceId="$ENVIRONMENT_ID" \
              gatewayStateStorageName="$STATE_STORAGE_NAME" \
              runtimeIdentityResourceId="$runtime_identity_id" \
              runtimeIdentityClientId="$runtime_client_id" \
              registryPullIdentityResourceId="$PULL_IDENTITY" \
              registryServer="${ACR_NAME}.azurecr.io" \
              containerImage="$CONTAINER_IMAGE" \
              coreBaseUrl="$CORE_BASE_URL" \
              coreScope="$CORE_SCOPE" \
              tenantId="$TENANT_ID" \
              workspaceId="$WORKSPACE_ID" \
              connectorInstanceId="$INSTANCE_ID" \
              marker="$MARKER" \
            --only-show-errors \
            --output none

          execution="$(az containerapp job start \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --query name -o tsv)"
          test -n "$execution"

          status=""
          for _ in $(seq 1 80); do
            status="$(az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --query properties.status -o tsv)"
            case "$status" in
              Succeeded|Failed|Canceled) break ;;
            esac
            sleep 3
          done

          replica=""
          for _ in $(seq 1 12); do
            replica="$(az containerapp job replica list \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$execution" \
              --query '[0].name' -o tsv 2>/dev/null || true)"
            [ -n "$replica" ] && break
            sleep 5
          done
          test -n "$replica"

          raw="$RUNNER_TEMP/sharepoint-relay-recovery.log"
          marker_found=false
          for _ in $(seq 1 12); do
            az containerapp job logs show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$execution" \
              --replica "$replica" \
              --container sharepoint-relay-recovery \
              --format text \
              --only-show-errors > "$raw" 2>&1 || true
            if grep -Eq 'ETS_SP_RELAY_RECOVERY_B64=[A-Za-z0-9_=-]+' "$raw"; then
              marker_found=true
              break
            fi
            sleep 5
          done
          test "$marker_found" = "true"

          python - "$raw" <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          match = re.search(r"ETS_SP_RELAY_RECOVERY_B64=([A-Za-z0-9_=-]+)", source)
          if match is None:
              raise SystemExit("bounded relay recovery result marker was not found")
          payload = json.loads(base64.urlsafe_b64decode(match.group(1)).decode("utf-8"))

          count_keys = {
              "terminal_total_before",
              "terminal_sharepoint_count",
              "terminal_marker_count",
              "terminal_local_invariants_ok",
              "terminal_local_invariant_failure",
              "core_present_match",
              "core_present_mismatch",
              "core_not_found",
              "core_auth_failure",
              "core_transport_error",
              "queue_reconciled",
              "marker_reconciled",
              "queue_terminal_after",
              "queue_retryable_after",
              "queue_synchronized_after",
          }
          flag_keys = {
              "checkpoint_present_after",
              "last_success_present_after",
              "gap_open_before",
              "gap_open_after",
              "observation_healthy_after",
              "upstream_healthy_after",
              "recovery_pass",
              "customer_identifiers_retained",
              "event_identifiers_retained",
              "event_hashes_retained",
              "core_payload_retained",
              "reusable_credential_retained",
              "public_evidence_safe",
              "queue_state_mutated",
              "connector_runtime_mutated",
              "core_state_mutated",
              "m365_source_to_proof_claimed",
              "soak_clock_started",
          }
          expected = {"schema_version", *count_keys, *flag_keys}
          if set(payload) != expected:
              raise SystemExit("bounded relay recovery returned an unexpected public shape")
          if payload["schema_version"] != "ets.live_sharepoint.relay_recovery.v1":
              raise SystemExit("bounded relay recovery schema changed")
          for key in count_keys:
              if not isinstance(payload[key], int) or isinstance(payload[key], bool) or payload[key] < 0:
                  raise SystemExit("bounded relay recovery count was invalid")
          for key in flag_keys:
              if not isinstance(payload[key], bool):
                  raise SystemExit("bounded relay recovery flag was invalid")
          if payload["terminal_total_before"] != 1 or payload["terminal_marker_count"] != 1:
              raise SystemExit("relay recovery is outside the single staged marker boundary")
          if payload["core_present_match"] != 1 or payload["queue_reconciled"] != 1 or payload["marker_reconciled"] != 1:
              raise SystemExit("relay recovery did not reconcile exactly the staged marker")
          if payload["queue_terminal_after"] != 0 or payload["queue_retryable_after"] != 0:
              raise SystemExit("relay recovery left failed relay rows")
          if payload["gap_open_before"] is not True or payload["gap_open_after"] is not False:
              raise SystemExit("relay recovery did not close the staged collection gap")
          if payload["observation_healthy_after"] is not True or payload["upstream_healthy_after"] is not True:
              raise SystemExit("relay recovery did not restore healthy state")
          if payload["recovery_pass"] is not True:
              raise SystemExit("live SharePoint relay recovery failed")
          if payload["public_evidence_safe"] is not True:
              raise SystemExit("relay recovery evidence is not public safe")
          if payload["queue_state_mutated"] is not True or payload["connector_runtime_mutated"] is not True:
              raise SystemExit("relay recovery did not declare required bounded mutation")
          if payload["core_state_mutated"] is not False:
              raise SystemExit("relay recovery unexpectedly declared Core mutation")
          for key in (
              "customer_identifiers_retained", "event_identifiers_retained",
              "event_hashes_retained", "core_payload_retained", "reusable_credential_retained",
              "m365_source_to_proof_claimed", "soak_clock_started",
          ):
              if payload[key] is not False:
                  raise SystemExit("relay recovery violated non-retention or claim boundary")

          payload.update({
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_sha": os.environ["GITHUB_SHA"],
              "image_digest": os.environ["CONTAINER_IMAGE"].rsplit("@", 1)[1],
              "fault_stage_workflow_run_id": int(os.environ["FAULT_STAGE_RUN_ID"]),
          })
          out = Path("evidence/live-sharepoint-relay-recovery/result.json")
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          for key in sorted(count_keys):
              print(key + "=" + str(payload[key]))
          for key in (
              "checkpoint_present_after", "last_success_present_after",
              "gap_open_before", "gap_open_after", "observation_healthy_after",
              "upstream_healthy_after", "recovery_pass",
          ):
              print(key + "=" + str(payload[key]).lower())
          PY

          test "$status" = "Succeeded"
          rm -f "$raw"

      - name: Upload bounded relay recovery evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-sharepoint-relay-recovery-${{ github.run_id }}
          path: evidence/live-sharepoint-relay-recovery/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Post Azure logout
        if: always()
        shell: bash
        run: az logout >/dev/null 2>&1 || true
