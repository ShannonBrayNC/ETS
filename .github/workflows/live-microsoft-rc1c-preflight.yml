name: Live Microsoft RC1C Read-Only Preflight

on:
  workflow_dispatch:
    inputs:
      image_source_sha:
        description: Exact approved main SHA used to build the deployed immutable image
        required: true
        type: string
      container_image:
        description: Exact deployed private-ACR image as registry/repository@sha256:<digest>
        required: true
        type: string
      connector_instance_id:
        description: Deployment-authoritative base Microsoft connector instance ID
        required: true
        default: m365-sharepoint-primary
        type: string

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: live-microsoft-rc1c-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Prove Purview permission and polling readiness
    runs-on: ubuntu-24.04
    environment: ets-azure-q1
    timeout-minutes: 20
    env:
      AZURE_CORE_ONLY_SHOW_ERRORS: 'true'
      LOCATION: eastus
      RESOURCE_GROUP: rg-ets-live-eastus
      ACR_NAME: etsq1a352eb89
      RESULT_ISSUE: '539'
      IMAGE_SOURCE_SHA: ${{ inputs.image_source_sha }}
      CONTAINER_IMAGE: ${{ inputs.container_image }}
      CONNECTOR_INSTANCE_ID: ${{ inputs.connector_instance_id }}
      JOB_NAME: ets-mrc1c-${{ github.run_id }}

    steps:
      - name: Check out exact preflight source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_source_sha }}
          persist-credentials: false

      - name: Assert protected immutable boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$IMAGE_SOURCE_SHA" = "$GITHUB_SHA"
          test -f infra/azure/ets-live-microsoft-rc1c-preflight.bicep
          test -n "$CONNECTOR_INSTANCE_ID"
          test "${#CONNECTOR_INSTANCE_ID}" -le 128
          python - <<'PY'
          import os
          import re

          source = os.environ["IMAGE_SOURCE_SHA"]
          image = os.environ["CONTAINER_IMAGE"]
          registry = os.environ["ACR_NAME"] + ".azurecr.io"
          if re.fullmatch(r"[0-9a-f]{40}", source) is None:
              raise SystemExit("image_source_sha is not canonical")
          pattern = rf"{re.escape(registry)}/[^@\s]+@sha256:[0-9a-f]{{64}}"
          if re.fullmatch(pattern, image) is None:
              raise SystemExit("container_image is outside the exact private-ACR digest boundary")
          PY
          mkdir -p evidence/live-microsoft-rc1c-preflight

      - name: Azure login with workload identity
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes --only-show-errors

      - name: Resolve exact private Gateway and separated identities
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          apps_json="$RUNNER_TEMP/rc1c-apps.json"
          resolved="$RUNNER_TEMP/rc1c-resolved.txt"
          az containerapp list --resource-group "$RESOURCE_GROUP" -o json > "$apps_json"

          python - "$apps_json" > "$resolved" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          apps = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(apps, list):
              raise SystemExit("live Container Apps listing was not an array")

          expected_instance = os.environ["CONNECTOR_INSTANCE_ID"]
          candidates = []
          for app in apps:
              props = app.get("properties") or {}
              containers = (props.get("template") or {}).get("containers") or []
              if len(containers) != 1:
                  continue
              env_items = containers[0].get("env") or []
              env = {
                  item.get("name"): item.get("value")
                  for item in env_items
                  if isinstance(item, dict) and "value" in item
              }
              if env.get("ETS_GATEWAY_INSTANCE_ID") == expected_instance:
                  candidates.append((app, containers[0], env_items, env))
          if len(candidates) != 1:
              raise SystemExit("expected exactly one deployment-authoritative Microsoft Gateway")

          app, container, env_items, env = candidates[0]
          props = app.get("properties") or {}
          configuration = props.get("configuration") or {}
          ingress = configuration.get("ingress") or {}
          if ingress.get("external") is not False:
              raise SystemExit("live Microsoft Gateway ingress must remain internal")
          scale = (props.get("template") or {}).get("scale") or {}
          if scale.get("minReplicas") != 1 or scale.get("maxReplicas") != 1:
              raise SystemExit("live Microsoft Gateway must remain single replica")
          if container.get("name") != "ets-gateway":
              raise SystemExit("live Microsoft Gateway container identity changed")
          if container.get("image") != os.environ["CONTAINER_IMAGE"]:
              raise SystemExit("live Microsoft Gateway image differs from the approved digest")

          graph_names = {
              "ETS_GATEWAY_GRAPH_NOTIFICATION_URL",
              "ETS_GATEWAY_GRAPH_CLIENT_STATE",
              "ETS_GATEWAY_GRAPH_SUBSCRIPTION_LIFETIME_SECONDS",
              "ETS_GATEWAY_GRAPH_SUBSCRIPTION_RENEWAL_WINDOW_SECONDS",
              "ETS_GATEWAY_MICROSOFT_HEALTH_POLICY_JSON",
          }
          present_graph_names = {
              str(item.get("name"))
              for item in env_items
              if isinstance(item, dict) and item.get("name") in graph_names
          }
          if present_graph_names:
              raise SystemExit(
                  "Graph lifecycle configuration is present before permission and ingress approval"
              )

          environment_id = str(props.get("environmentId") or "")
          volumes = (props.get("template") or {}).get("volumes") or []
          state_volumes = [item for item in volumes if item.get("name") == "gateway-state"]
          if len(state_volumes) != 1:
              raise SystemExit("live Microsoft Gateway state volume is unavailable")
          storage_name = str(state_volumes[0].get("storageName") or "")

          registries = configuration.get("registries") or []
          if len(registries) != 1:
              raise SystemExit("live Microsoft Gateway must expose exactly one ACR binding")
          registry = registries[0]
          expected_server = os.environ["ACR_NAME"] + ".azurecr.io"
          if str(registry.get("server") or "").casefold() != expected_server.casefold():
              raise SystemExit("live Microsoft Gateway registry server changed")
          pull_identity = str(registry.get("identity") or "")

          identity_names = (
              "ETS_GATEWAY_MANAGED_IDENTITY_CLIENT_ID",
              "ETS_GATEWAY_DIRECTORY_MANAGED_IDENTITY_CLIENT_ID",
              "ETS_GATEWAY_PURVIEW_MANAGED_IDENTITY_CLIENT_ID",
          )
          client_ids = [str(env.get(name) or "").strip() for name in identity_names]
          if any(not value for value in client_ids):
              raise SystemExit("live Microsoft Gateway omitted a separated runtime identity")
          if len({value.casefold() for value in client_ids}) != 3:
              raise SystemExit("live Microsoft runtime identity client IDs are not distinct")
          if env.get("ETS_GATEWAY_MICROSOFT_APPLICATION_ID", "").casefold() != client_ids[0].casefold():
              raise SystemExit("SharePoint application ID differs from the SharePoint/Core UAMI")

          assigned = (app.get("identity") or {}).get("userAssignedIdentities") or {}
          if len(assigned) != 4:
              raise SystemExit("live Microsoft Gateway must attach exactly four user-assigned identities")

          def resource_id_for(client_id):
              matches = [
                  resource_id
                  for resource_id, value in assigned.items()
                  if str((value or {}).get("clientId") or "").casefold() == client_id.casefold()
              ]
              if len(matches) != 1:
                  raise SystemExit("runtime client ID did not resolve to one attached Azure identity")
              return matches[0]

          sharepoint_identity = resource_id_for(client_ids[0])
          directory_identity = resource_id_for(client_ids[1])
          purview_identity = resource_id_for(client_ids[2])
          exact_ids = {
              sharepoint_identity.casefold(),
              directory_identity.casefold(),
              purview_identity.casefold(),
              pull_identity.casefold(),
          }
          if len(exact_ids) != 4 or set(key.casefold() for key in assigned) != exact_ids:
              raise SystemExit("live Microsoft identity assignment set contains drift")

          microsoft_tenant_id = str(env.get("ETS_GATEWAY_MICROSOFT_TENANT_ID") or "")
          if re.fullmatch(
              r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-"
              r"[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
              microsoft_tenant_id,
          ) is None:
              raise SystemExit("live Microsoft tenant ID is not canonical")
          if not environment_id or not storage_name or not pull_identity:
              raise SystemExit("live Microsoft RC1C preflight prerequisites are incomplete")
          if re.fullmatch(r"[A-Za-z0-9._-]{1,128}", expected_instance) is None:
              raise SystemExit("connector instance ID is outside the qualified identifier profile")

          print("environment_id=" + environment_id)
          print("state_storage_name=" + storage_name)
          print("pull_identity=" + pull_identity)
          print("purview_identity=" + purview_identity)
          print("purview_client_id=" + client_ids[2])
          print("microsoft_tenant_id=" + microsoft_tenant_id)
          PY

          while IFS='=' read -r key value; do
            test -n "$key"
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          done < "$resolved"
          rm -f "$apps_json" "$resolved"

      - name: Deploy and execute bounded read-only preflight
        id: execute
        shell: bash
        env:
          ENVIRONMENT_ID: ${{ steps.runtime.outputs.environment_id }}
          STATE_STORAGE_NAME: ${{ steps.runtime.outputs.state_storage_name }}
          PULL_IDENTITY: ${{ steps.runtime.outputs.pull_identity }}
          PURVIEW_IDENTITY: ${{ steps.runtime.outputs.purview_identity }}
          PURVIEW_CLIENT_ID: ${{ steps.runtime.outputs.purview_client_id }}
          MICROSOFT_TENANT_ID: ${{ steps.runtime.outputs.microsoft_tenant_id }}
        run: |
          set -euo pipefail
          test "${#JOB_NAME}" -le 32
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/ets-live-microsoft-rc1c-preflight.bicep \
            --parameters \
              location="$LOCATION" \
              jobName="$JOB_NAME" \
              managedEnvironmentResourceId="$ENVIRONMENT_ID" \
              gatewayStateStorageName="$STATE_STORAGE_NAME" \
              registryPullIdentityResourceId="$PULL_IDENTITY" \
              purviewIdentityResourceId="$PURVIEW_IDENTITY" \
              purviewIdentityClientId="$PURVIEW_CLIENT_ID" \
              registryServer="${ACR_NAME}.azurecr.io" \
              containerImage="$CONTAINER_IMAGE" \
              connectorInstanceId="$CONNECTOR_INSTANCE_ID" \
              microsoftTenantId="$MICROSOFT_TENANT_ID" \
            --only-show-errors \
            --output none

          execution="$(az containerapp job start \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query name -o tsv)"
          test -n "$execution"

          status=""
          for _ in $(seq 1 100); do
            status="$(az containerapp job execution show \
              --name "$JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --query properties.status -o tsv)"
            case "$status" in
              Succeeded|Failed|Canceled) break ;;
            esac
            sleep 3
          done
          if [ "$status" != "Succeeded" ]; then
            echo "::error::RC1C preflight execution ended with status ${status:-unknown}"
            exit 1
          fi

          replica=""
          for _ in $(seq 1 12); do
            replica="$(az containerapp job replica list \
              --name "$JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$execution" \
              --query '[0].name' -o tsv 2>/dev/null || true)"
            if [ -n "$replica" ]; then
              break
            fi
            sleep 5
          done
          test -n "$replica"

          raw="$RUNNER_TEMP/microsoft-rc1c-preflight.log"
          found=false
          for _ in $(seq 1 12); do
            az containerapp job logs show \
              --name "$JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$execution" \
              --replica "$replica" \
              --container microsoft-rc1c-preflight \
              --format text \
              --only-show-errors > "$raw" 2>&1 || true
            if grep -Eq 'ETS_M365_RC1C_PREFLIGHT_B64=[A-Za-z0-9_=-]+' "$raw"; then
              found=true
              break
            fi
            sleep 5
          done
          if [ "$found" != "true" ]; then
            rm -f "$raw"
            echo "::error::RC1C preflight result marker was unavailable"
            exit 1
          fi

          python - "$raw" <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          matches = re.findall(r"ETS_M365_RC1C_PREFLIGHT_B64=([A-Za-z0-9_=-]+)", source)
          if not matches:
              raise SystemExit("RC1C preflight result marker was not found")
          payload = json.loads(base64.urlsafe_b64decode(matches[-1]).decode("utf-8"))
          allowed = {
              "schema_version",
              "purview_identity_token_acquired",
              "purview_token_audience_exact",
              "purview_token_tenant_exact",
              "purview_token_application_exact",
              "purview_token_roles_exact",
              "purview_subscriptions_list_reachable",
              "purview_subscription_present",
              "purview_subscription_status",
              "purview_webhook_configured",
              "purview_instance_present",
              "purview_checkpoint_present",
              "purview_checkpoint_revision",
              "purview_retry_count",
              "purview_last_success_present",
              "purview_healthy_observation",
              "purview_gap_open",
              "purview_lease_active",
              "graph_durable_subscription_present",
              "raw_purview_payload_retained",
              "customer_identifiers_retained",
              "reusable_credential_retained",
              "public_evidence_safe",
              "rc1c_live_qualified",
              "soak_clock_started",
          }
          if set(payload) != allowed:
              raise SystemExit("RC1C preflight returned an unexpected public shape")
          if payload.get("schema_version") != "ets.live_microsoft.rc1c_preflight.v1":
              raise SystemExit("RC1C preflight schema changed")
          required_true = (
              "purview_identity_token_acquired",
              "purview_token_audience_exact",
              "purview_token_tenant_exact",
              "purview_token_application_exact",
              "purview_token_roles_exact",
              "purview_subscriptions_list_reachable",
              "purview_instance_present",
              "public_evidence_safe",
          )
          for key in required_true:
              if payload.get(key) is not True:
                  raise SystemExit("RC1C preflight predicate failed: " + key)
          required_false = (
              "purview_webhook_configured",
              "graph_durable_subscription_present",
              "raw_purview_payload_retained",
              "customer_identifiers_retained",
              "reusable_credential_retained",
              "rc1c_live_qualified",
              "soak_clock_started",
          )
          for key in required_false:
              if payload.get(key) is not False:
                  raise SystemExit("RC1C preflight fail-closed boundary failed: " + key)
          for key in (
              "purview_subscription_present",
              "purview_checkpoint_present",
              "purview_last_success_present",
              "purview_healthy_observation",
              "purview_gap_open",
              "purview_lease_active",
          ):
              if not isinstance(payload.get(key), bool):
                  raise SystemExit("RC1C preflight boolean is invalid: " + key)
          status = payload.get("purview_subscription_status")
          if status not in {"absent", "enabled", "disabled"}:
              raise SystemExit("RC1C Purview subscription status is invalid")
          if (status != "absent") != payload["purview_subscription_present"]:
              raise SystemExit("RC1C Purview subscription presence/status conflict")
          for key in ("purview_checkpoint_revision", "purview_retry_count"):
              value = payload.get(key)
              if not isinstance(value, int) or isinstance(value, bool) or value < 0:
                  raise SystemExit("RC1C preflight counter is invalid: " + key)

          image = os.environ["CONTAINER_IMAGE"]
          manifest = dict(payload)
          manifest.update(
              {
                  "schema_version": "ets.live_microsoft.rc1c_preflight_handoff.v1",
                  "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "source_sha": os.environ["GITHUB_SHA"],
                  "image_digest": image.rsplit("@", 1)[1],
                  "preflight_passed": True,
                  "graph_callback_ingress_external": False,
                  "graph_lifecycle_configuration_present": False,
                  "graph_subscription_permission_decision_pending": True,
                  "rc1c_live_qualified": False,
                  "soak_clock_started": False,
              }
          )
          out = Path("evidence/live-microsoft-rc1c-preflight/result.json")
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          rm -f "$raw"

      - name: Record fail-closed preflight outcome
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": "ets.live_microsoft.rc1c_preflight_failure.v1",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_sha": os.environ["GITHUB_SHA"],
              "preflight_passed": False,
              "graph_callback_ingress_external": False,
              "graph_lifecycle_configuration_present": False,
              "graph_subscription_permission_decision_pending": True,
              "rc1c_live_qualified": False,
              "customer_identifiers_retained": False,
              "reusable_credential_retained": False,
              "public_evidence_safe": True,
              "soak_clock_started": False,
          }
          out = Path("evidence/live-microsoft-rc1c-preflight/failure.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload sanitized RC1C preflight evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-microsoft-rc1c-preflight-${{ github.run_id }}
          path: evidence/live-microsoft-rc1c-preflight/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish successful protected handoff
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - > "$RUNNER_TEMP/rc1c-preflight-comment.md" <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("evidence/live-microsoft-rc1c-preflight/result.json").read_text(
                  encoding="utf-8"
              )
          )
          print("### Microsoft RC1C read-only live preflight")
          print()
          print(f"- workflow run: `{payload['workflow_run_id']}`")
          print(f"- exact source: `{payload['source_sha']}`")
          print(f"- immutable image digest: `{payload['image_digest']}`")
          print("- Purview UAMI token audience/application/tenant: **exact**")
          print("- Purview token roles: **exactly ActivityFeed.Read**")
          print("- Purview subscription list: **read-only reachable**")
          print(f"- Audit.General subscription status: **{payload['purview_subscription_status']}**")
          print("- Purview webhook configured: **false**")
          print("- Graph callback ingress external: **false**")
          print("- Graph lifecycle configuration/durable subscription: **absent**")
          print("- Graph drive subscription permission decision: **pending**")
          print("- customer identifiers retained in public evidence: **false**")
          print("- reusable credentials retained: **false**")
          print("- RC1C live-qualified: **false**")
          print("- 72-hour soak clock started: **false**")
          PY
          gh issue comment "$RESULT_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/rc1c-preflight-comment.md"
          rm -f "$RUNNER_TEMP/rc1c-preflight-comment.md"

      - name: Remove ephemeral preflight job
        if: always()
        shell: bash
        run: |
          az containerapp job delete \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --yes \
            --only-show-errors >/dev/null 2>&1 || true
