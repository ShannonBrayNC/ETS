name: Azure Migration Destination Immutable Image Publication

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: azure-migration-destination-image-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, scan, attest, and publish destination Gateway image
    runs-on: ubuntu-24.04
    environment: ets-azure-migration-destination-image-publish
    timeout-minutes: 60
    env:
      AZURE_CORE_ONLY_SHOW_ERRORS: 'true'
      EXPECTED_TENANT_ID: 0d20cf0f-3498-46c1-a0db-69b09c634cc2
      EXPECTED_SUBSCRIPTION_ID: 5729a82b-8850-4868-b96c-96c3805cbb9d
      ACR_NAME: etsprod7c8ab70380
      ACR_RESOURCE_GROUP: rg-ets-shared-eastus
      IMAGE_REPOSITORY: ets/hosted-q1
      EVIDENCE_DIR: evidence/m365-gate2-destination-image

    steps:
      - name: Check out exact publication source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert exact source and Gate 2 image capability source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          test -f Dockerfile
          test -f scripts/acr_oauth_docker_login.py
          grep -q 'AzureFederatedManagedIdentityCredentialProfile' ets/connectors/credentials/azure_managed_identity.py
          grep -q 'AzureFederatedManagedIdentityCredentialProvider' ets/connectors/credentials/azure_managed_identity.py
          mkdir -p "$EVIDENCE_DIR"
          printf 'source_sha=%s\nworkflow_run_id=%s\n' "$actual" "$GITHUB_RUN_ID" > "$EVIDENCE_DIR/source.txt"

      - name: Azure login with destination publisher workload identity
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify exact destination Azure context
        shell: bash
        run: |
          set -euo pipefail
          actual_tenant="$(az account show --query tenantId -o tsv)"
          actual_subscription="$(az account show --query id -o tsv)"
          test "${actual_tenant,,}" = "${EXPECTED_TENANT_ID,,}"
          test "${actual_subscription,,}" = "${EXPECTED_SUBSCRIPTION_ID,,}"

      - name: Validate exact destination ACR posture
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          registry_json="$RUNNER_TEMP/destination-acr.json"
          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$ACR_RESOURCE_GROUP" \
            --query '{id:id,loginServer:loginServer,adminUserEnabled:adminUserEnabled,publicNetworkAccess:publicNetworkAccess,networkDefaultAction:networkRuleSet.defaultAction,roleAssignmentMode:roleAssignmentMode}' \
            -o json > "$registry_json"

          readarray -t values < <(python - "$registry_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          for key in (
              'id',
              'loginServer',
              'adminUserEnabled',
              'publicNetworkAccess',
              'networkDefaultAction',
              'roleAssignmentMode',
          ):
              value = payload.get(key)
              if isinstance(value, bool):
                  value = str(value).lower()
              print('' if value is None else str(value))
          PY
          )

          registry_id="${values[0]}"
          registry_server="${values[1]}"
          admin_enabled="${values[2],,}"
          public_network_access="${values[3]:-unknown}"
          network_default_action="${values[4]:-unknown}"
          role_assignment_mode="${values[5]:-unknown}"

          test "$registry_server" = "$ACR_NAME.azurecr.io"
          test "$admin_enabled" = "false"
          test "$role_assignment_mode" = "LegacyRegistryPermissions"
          registry_subscription="$(printf '%s' "$registry_id" | cut -d/ -f3)"
          test "${registry_subscription,,}" = "${EXPECTED_SUBSCRIPTION_ID,,}"
          if [ "${public_network_access,,}" = "disabled" ]; then
            echo 'Destination ACR public network access is disabled; GitHub-hosted publication cannot proceed.' >&2
            exit 1
          fi

          arm_status="$(az acr config authentication-as-arm show \
            --registry "$ACR_NAME" \
            --resource-group "$ACR_RESOURCE_GROUP" \
            --query status -o tsv | tr '[:upper:]' '[:lower:]')"
          test "$arm_status" = "enabled"

          tag="gate2-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          subject_name="$registry_server/$IMAGE_REPOSITORY"
          tag_ref="$subject_name:$tag"
          echo "registry_server=$registry_server" >> "$GITHUB_OUTPUT"
          echo "subject_name=$subject_name" >> "$GITHUB_OUTPUT"
          echo "tag_ref=$tag_ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "role_assignment_mode=$role_assignment_mode" >> "$GITHUB_OUTPUT"

          cat > "$EVIDENCE_DIR/registry.txt" <<EOF
          registry_name=$ACR_NAME
          registry_resource_group=$ACR_RESOURCE_GROUP
          registry_server=$registry_server
          image_repository=$IMAGE_REPOSITORY
          registry_admin_user_enabled=false
          role_assignment_mode=$role_assignment_mode
          arm_audience_authentication=true
          public_network_access=$public_network_access
          network_default_action=$network_default_action
          publication_environment=ets-azure-migration-destination-image-publish
          EOF

      - name: Probe destination ACR data plane
        shell: bash
        env:
          REGISTRY_SERVER: ${{ steps.registry.outputs.registry_server }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          server = os.environ['REGISTRY_SERVER']
          request = urllib.request.Request(
              f'https://{server}/v2/',
              headers={'User-Agent': 'ets-gate2-destination-image/1'},
              method='GET',
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = int(response.status)
          except urllib.error.HTTPError as exc:
              status = int(exc.code)
          except urllib.error.URLError as exc:
              raise SystemExit('Destination ACR data-plane transport failed') from exc
          if status not in {200, 401, 403}:
              raise SystemExit(f'Unexpected destination ACR pre-authentication status: {status}')
          print(f'Destination ACR data plane reachable (HTTP {status})')
          PY

      - name: Authenticate Docker through direct ACR OAuth exchange
        shell: bash
        env:
          REGISTRY_SERVER: ${{ steps.registry.outputs.registry_server }}
        run: |
          set -euo pipefail
          export ACR_TENANT_ID="$(az account show --query tenantId -o tsv)"
          export ACR_AAD_ACCESS_TOKEN="$(az account get-access-token \
            --scope https://containerregistry.azure.net/.default \
            --query accessToken -o tsv)"
          if ! python scripts/acr_oauth_docker_login.py; then
            unset ACR_AAD_ACCESS_TOKEN ACR_TENANT_ID
            echo 'Destination ACR OAuth exchange failed. Verify the dedicated publisher has the exact ACR configuration-reader and AcrPush assignments.' >&2
            exit 1
          fi
          unset ACR_AAD_ACCESS_TOKEN ACR_TENANT_ID

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push destination Gate 2 image
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.tag_ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ETS Gate 2 Destination Gateway
          provenance: mode=max
          sbom: true

      - name: Require immutable digest and verify registry subject
        id: image
        shell: bash
        env:
          SUBJECT_NAME: ${{ steps.registry.outputs.subject_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python - "$IMAGE_DIGEST" <<'PY'
          import re
          import sys
          digest = sys.argv[1]
          if re.fullmatch(r'sha256:[0-9a-f]{64}', digest) is None:
              raise SystemExit('Build did not return a canonical sha256 digest')
          PY
          immutable_ref="$SUBJECT_NAME@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$immutable_ref" >/dev/null
          echo "immutable_ref=$immutable_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$immutable_ref" > "$EVIDENCE_DIR/immutable-image.txt"

      - name: Verify published image contains Gate 2 federated provider
        shell: bash
        env:
          IMMUTABLE_REF: ${{ steps.image.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          docker run --rm "$IMMUTABLE_REF" python -c "from azure.identity import ClientAssertionCredential; from ets.connectors.credentials.azure_managed_identity import AzureFederatedManagedIdentityCredentialProfile, AzureFederatedManagedIdentityCredentialProvider; print('gate2_federated_provider_import=pass')"

      - name: Generate retained SPDX JSON SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.image.outputs.immutable_ref }}
          format: spdx-json
          output-file: evidence/m365-gate2-destination-image/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate retained HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.immutable_ref }}
          scan-type: image
          format: json
          output: evidence/m365-gate2-destination-image/trivy-high-critical.json
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Summarize vulnerability gate and publication manifest
        id: gate
        shell: bash
        env:
          SUBJECT_NAME: ${{ steps.registry.outputs.subject_name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMMUTABLE_REF: ${{ steps.image.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ['EVIDENCE_DIR'], 'trivy-high-critical.json').read_text(encoding='utf-8'))
          fixable = {'HIGH': 0, 'CRITICAL': 0}
          upstream_unfixed = {'HIGH': 0, 'CRITICAL': 0}
          for result in report.get('Results') or []:
              for finding in result.get('Vulnerabilities') or []:
                  severity = str(finding.get('Severity', '')).upper()
                  if severity not in fixable:
                      continue
                  if str(finding.get('FixedVersion') or '').strip():
                      fixable[severity] += 1
                  else:
                      upstream_unfixed[severity] += 1
          gate = 'PASS' if sum(fixable.values()) == 0 else 'FAIL'
          manifest = {
              'schema_version': 'ets.m365.gate2.destination_image.v1',
              'source_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'subject_name': os.environ['SUBJECT_NAME'],
              'image_digest': os.environ['IMAGE_DIGEST'],
              'immutable_image': os.environ['IMMUTABLE_REF'],
              'vulnerability_gate': gate,
              'fixable_high': fixable['HIGH'],
              'fixable_critical': fixable['CRITICAL'],
              'upstream_unfixed_high': upstream_unfixed['HIGH'],
              'upstream_unfixed_critical': upstream_unfixed['CRITICAL'],
              'gate2_federated_provider_import_verified': True,
              'production_gateway_mutated': False,
              'registry_credentials_retained': False,
          }
          evidence_dir = Path(os.environ['EVIDENCE_DIR'])
          evidence_dir.joinpath('manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'vulnerability_gate={gate}\n')
          PY

      - name: Create GitHub build-provenance attestation
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ steps.registry.outputs.subject_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub SBOM attestation
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ steps.registry.outputs.subject_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: evidence/m365-gate2-destination-image/sbom.spdx.json
          push-to-registry: true

      - name: Upload non-secret destination image evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: m365-gate2-destination-image-${{ github.run_id }}
          path: evidence/m365-gate2-destination-image/
          if-no-files-found: error
          retention-days: 90

      - name: Log out Docker from destination ACR
        if: always() && steps.registry.outputs.registry_server != ''
        shell: bash
        env:
          REGISTRY_SERVER: ${{ steps.registry.outputs.registry_server }}
        run: docker logout "$REGISTRY_SERVER" >/dev/null 2>&1 || true

      - name: Enforce vulnerability gate
        if: always()
        shell: bash
        env:
          VULNERABILITY_GATE: ${{ steps.gate.outputs.vulnerability_gate }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if [ "$GATE_OUTCOME" != "success" ]; then
            echo 'Destination image vulnerability scan/gate did not complete.' >&2
            exit 1
          fi
          if [ "$VULNERABILITY_GATE" != "PASS" ]; then
            echo 'Destination image contains fixable HIGH/CRITICAL vulnerability findings.' >&2
            exit 1
          fi
