name: Edge Virtual Demo

on:
  pull_request:
    paths:
      - "edge-demo/**"
      - "ets/api/**"
      - "ets/core/**"
      - "ets/edge/**"
      - "ets/explorer-ui/**"
      - "tests/unit/test_edge_*.py"
      - ".github/workflows/edge-virtual-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Edge adapter and sync code
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check \
            ets/edge \
            tests/unit/test_edge_webhook_adapter.py \
            tests/unit/test_edge_sync_queue.py \
            tests/unit/test_edge_upstream_demo.py \
            tests/unit/test_edge_device_identity.py \
            tests/unit/test_edge_protected_ingress.py
          python -m mypy ets/edge
          python -m pytest -q \
            tests/unit/test_edge_webhook_adapter.py \
            tests/unit/test_edge_sync_queue.py \
            tests/unit/test_edge_upstream_demo.py \
            tests/unit/test_edge_device_identity.py \
            tests/unit/test_edge_protected_ingress.py

      - name: Build and start ETS Edge Virtual
        run: docker compose -f edge-demo/docker-compose.yml up -d --build

      - name: Wait for appliance readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8400/ready > /tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          docker compose -f edge-demo/docker-compose.yml ps
          docker compose -f edge-demo/docker-compose.yml logs
          exit 1

      - name: Confirm protected durable signed demo profile
        run: |
          docker compose -f edge-demo/docker-compose.yml exec -T edge-api \
            cat /var/lib/ets/edge-local-api-key > /tmp/edge-api-key
          chmod 600 /tmp/edge-api-key

          python - <<'PY'
          import json
          from pathlib import Path

          ready = json.loads(Path('/tmp/ready.json').read_text())
          key = Path('/tmp/edge-api-key').read_text().strip()
          assert ready['status'] == 'ready', ready
          assert ready['storage'] == 'sqlite', ready
          assert ready['signing'] == 'ed25519', ready
          assert ready['auth'] == 'local_api_key', ready
          assert len(key.encode('utf-8')) >= 32
          PY

          MISSING_CODE="$(curl -q --silent --output /tmp/auth-missing.json \
            --write-out '%{http_code}' http://localhost:8400/api/v1/log/head)"
          test "${MISSING_CODE}" = "401"

          WRONG_CODE="$(curl -q --silent --output /tmp/auth-wrong.json \
            --write-out '%{http_code}' \
            -H 'X-ETS-API-Key: WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW' \
            http://localhost:8400/api/v1/log/head)"
          test "${WRONG_CODE}" = "401"

          EDGE_API_KEY="$(cat /tmp/edge-api-key)"
          printf 'header = "X-ETS-API-Key: %s"\n' "${EDGE_API_KEY}" > "${HOME}/.curlrc"
          chmod 600 "${HOME}/.curlrc"

          curl --fail --silent --show-error \
            http://localhost:8400/api/v1/log/head > /tmp/authenticated-head.json
          curl --fail --silent --show-error \
            http://localhost:8400/edge/v1/device/identity > /tmp/device-identity.json

          python - <<'PY'
          import json
          from pathlib import Path

          identity = json.loads(Path('/tmp/device-identity.json').read_text())
          serialized = json.dumps(identity, sort_keys=True).lower()
          assert identity['schema_version'] == 'ets.edge.device_identity.v1', identity
          assert identity['key_custody'] == 'software_volume', identity
          assert identity['hardware_attested'] is False, identity
          assert identity['device_id'].startswith('ets-edge:'), identity
          assert 'private' not in serialized, identity
          assert 'api_key' not in serialized, identity
          PY

      - name: Capture, prove, and verify an external webhook
        run: |
          printf '%s' '{"marker":"ETS_RAW_WEBHOOK_SECRET_9f31","action":"invoice.approved","amount":4200}' > /tmp/webhook.json

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'X-ETS-Tenant: tenant_demo' \
            -H 'X-ETS-Workspace: workspace_alpha' \
            -H 'X-Correlation-ID: corr-edge-webhook-ci-001' \
            -H 'X-ETS-Actor: synthetic-business-app' \
            --data-binary @/tmp/webhook.json \
            http://localhost:8400/edge/v1/capture/webhook/business-app > /tmp/webhook-receipt.json

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          body = Path('/tmp/webhook.json').read_bytes()
          receipt = json.loads(Path('/tmp/webhook-receipt.json').read_text())
          assert receipt['content_hash'] == hashlib.sha256(body).hexdigest(), receipt
          assert receipt['content_hash_alg'] == 'sha256', receipt
          assert receipt['byte_size'] == len(body), receipt
          assert receipt['sync_state'] == 'pending', receipt
          Path('/tmp/webhook-event-id.txt').write_text(receipt['event_id'])
          PY

          WEBHOOK_EVENT_ID="$(cat /tmp/webhook-event-id.txt)"

          curl --fail --silent --show-error \
            -H 'X-ETS-Tenant: tenant_demo' \
            -H 'X-ETS-Workspace: workspace_alpha' \
            "http://localhost:8400/api/v1/events/${WEBHOOK_EVENT_ID}" > /tmp/webhook-event.json

          curl --fail --silent --show-error \
            -H 'X-ETS-Tenant: tenant_demo' \
            -H 'X-ETS-Workspace: workspace_alpha' \
            "http://localhost:8400/api/v1/proofs/inclusion/${WEBHOOK_EVENT_ID}" > /tmp/webhook-proof.json

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'X-ETS-Tenant: tenant_demo' \
            -H 'X-ETS-Workspace: workspace_alpha' \
            --data-binary @/tmp/webhook-proof.json \
            http://localhost:8400/api/v1/verify/inclusion > /tmp/webhook-verification.json

          python - <<'PY'
          import json
          from pathlib import Path

          event = json.loads(Path('/tmp/webhook-event.json').read_text())
          verification = json.loads(Path('/tmp/webhook-verification.json').read_text())
          assert event['event']['event_type'] == 'evidence.captured.webhook', event
          assert event['event']['metadata']['raw_payload_retained'] is False, event
          assert event['event']['correlation_id'] == 'corr-edge-webhook-ci-001', event
          assert verification['valid'] is True, verification
          PY

          docker compose -f edge-demo/docker-compose.yml exec -T edge-api python - <<'PY'
          from pathlib import Path

          for database_file in Path('/var/lib/ets').glob('edge.db*'):
              assert b'ETS_RAW_WEBHOOK_SECRET_9f31' not in database_file.read_bytes(), database_file
          PY

          docker compose -f edge-demo/docker-compose.yml exec -T edge-webhook python - <<'PY'
          from pathlib import Path

          for database_file in Path('/var/lib/ets').glob('edge-sync.db*'):
              assert b'ETS_RAW_WEBHOOK_SECRET_9f31' not in database_file.read_bytes(), database_file
          PY

          printf '%s' '{"marker":"ETS_RAW_WEBHOOK_SECRET_9f31","action":"invoice.rejected","amount":4200}' > /tmp/webhook-modified.json
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'X-ETS-Tenant: tenant_demo' \
            -H 'X-ETS-Workspace: workspace_alpha' \
            --data-binary @/tmp/webhook-modified.json \
            http://localhost:8400/edge/v1/capture/webhook/business-app > /tmp/webhook-modified-receipt.json

          python - <<'PY'
          import json
          from pathlib import Path

          original = json.loads(Path('/tmp/webhook-receipt.json').read_text())
          modified = json.loads(Path('/tmp/webhook-modified-receipt.json').read_text())
          assert original['content_hash'] != modified['content_hash'], (original, modified)
          assert original['event_id'] != modified['event_id'], (original, modified)
          PY

      - name: Prove disconnect restart reconnect synchronization
        run: |
          docker compose -f edge-demo/docker-compose.yml stop edge-upstream

          printf '%s' '{"action":"shipment.released","shipment":"SHP-9001","offline":true}' > /tmp/offline-webhook.json
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'X-ETS-Tenant: tenant_demo' \
            -H 'X-ETS-Workspace: workspace_alpha' \
            -H 'X-Correlation-ID: corr-edge-offline-001' \
            --data-binary @/tmp/offline-webhook.json \
            http://localhost:8400/edge/v1/capture/webhook/warehouse-app > /tmp/offline-receipt.json

          curl --fail --silent --show-error \
            -X POST http://localhost:8400/edge/v1/sync/run > /tmp/offline-sync.json
          curl --fail --silent --show-error \
            http://localhost:8400/edge/v1/sync/status > /tmp/offline-status.json

          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/offline-receipt.json').read_text())
          sync = json.loads(Path('/tmp/offline-sync.json').read_text())
          status = json.loads(Path('/tmp/offline-status.json').read_text())
          assert receipt['sync_state'] == 'pending', receipt
          assert sync['attempted'] == 3, sync
          assert sync['retryable_failure'] == 3, sync
          assert sync['synchronized'] == 0, sync
          assert sync['upstream_status'] == 'offline', sync
          assert status['queue_depth'] == 3, status
          assert status['retryable_failure'] == 3, status
          PY

          docker compose -f edge-demo/docker-compose.yml restart edge-webhook
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8400/edge/v1/sync/status > /tmp/restarted-sync-status.json; then
              break
            fi
            sleep 2
          done

          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('/tmp/restarted-sync-status.json').read_text())
          assert status['queue_depth'] == 3, status
          assert status['retryable_failure'] == 3, status
          PY

          docker compose -f edge-demo/docker-compose.yml start edge-upstream
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8400/edge/v1/upstream/status > /tmp/upstream-before.json; then
              break
            fi
            sleep 2
          done

          curl --fail --silent --show-error \
            -X POST http://localhost:8400/edge/v1/sync/run > /tmp/reconnect-sync.json
          curl --fail --silent --show-error \
            http://localhost:8400/edge/v1/sync/status > /tmp/reconnect-status.json
          curl --fail --silent --show-error \
            http://localhost:8400/edge/v1/upstream/status > /tmp/upstream-after.json
          curl --fail --silent --show-error \
            -X POST http://localhost:8400/edge/v1/sync/run > /tmp/idempotent-sync.json

          python - <<'PY'
          import json
          from pathlib import Path

          sync = json.loads(Path('/tmp/reconnect-sync.json').read_text())
          status = json.loads(Path('/tmp/reconnect-status.json').read_text())
          upstream = json.loads(Path('/tmp/upstream-after.json').read_text())
          repeat = json.loads(Path('/tmp/idempotent-sync.json').read_text())
          assert sync['attempted'] == 3, sync
          assert sync['synchronized'] == 3, sync
          assert sync['retryable_failure'] == 0, sync
          assert sync['terminal_failure'] == 0, sync
          assert sync['upstream_status'] == 'online', sync
          assert status['queue_depth'] == 0, status
          assert status['synchronized'] == 3, status
          assert upstream['accepted_records'] == 3, upstream
          assert repeat['attempted'] == 0, repeat
          PY

      - name: Append, prove, and verify a synthetic event
        run: |
          cat > /tmp/event.json <<'JSON'
          {
            "event_id": "evt_edge_virtual_ci_001",
            "tenant_id": "tenant_demo",
            "workspace_id": "workspace_alpha",
            "evidence_id": "evidence_edge_virtual_ci_001",
            "event_type": "evidence.registered",
            "subject_ref": "case:edge-virtual-ci",
            "content_hash": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "content_hash_alg": "sha256",
            "metadata": {"source": "edge-virtual-ci", "synthetic": true},
            "created_at_utc": "2026-08-12T23:00:00Z",
            "schema_version": "ets.event.v1",
            "source_system": "edge-virtual-ci"
          }
          JSON

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'X-ETS-Tenant: tenant_demo' \
            -H 'X-ETS-Workspace: workspace_alpha' \
            --data-binary @/tmp/event.json \
            http://localhost:8400/api/v1/events > /tmp/append.json

          curl --fail --silent --show-error \
            -H 'X-ETS-Tenant: tenant_demo' \
            -H 'X-ETS-Workspace: workspace_alpha' \
            http://localhost:8400/api/v1/proofs/inclusion/evt_edge_virtual_ci_001 > /tmp/proof.json

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'X-ETS-Tenant: tenant_demo' \
            -H 'X-ETS-Workspace: workspace_alpha' \
            --data-binary @/tmp/proof.json \
            http://localhost:8400/api/v1/verify/inclusion > /tmp/verification.json

          python - <<'PY'
          import json
          from pathlib import Path

          append = json.loads(Path('/tmp/append.json').read_text())
          verification = json.loads(Path('/tmp/verification.json').read_text())
          assert append['event_id'] == 'evt_edge_virtual_ci_001', append
          assert append['tree_head']['signature'], append
          assert verification['valid'] is True, verification
          PY

      - name: Restart API and prove persistence
        run: |
          docker compose -f edge-demo/docker-compose.yml restart edge-api

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8400/ready > /dev/null; then
              break
            fi
            sleep 2
          done

          RESTARTED_KEY="$(docker compose -f edge-demo/docker-compose.yml exec -T edge-api \
            cat /var/lib/ets/edge-local-api-key)"
          ORIGINAL_KEY="$(cat /tmp/edge-api-key)"
          test "${RESTARTED_KEY}" = "${ORIGINAL_KEY}"

          curl --fail --silent --show-error \
            http://localhost:8400/edge/v1/device/identity > /tmp/restarted-device-identity.json

          curl --fail --silent --show-error \
            -H 'X-ETS-Tenant: tenant_demo' \
            -H 'X-ETS-Workspace: workspace_alpha' \
            http://localhost:8400/api/v1/events/evt_edge_virtual_ci_001 > /tmp/restarted-event.json

          WEBHOOK_EVENT_ID="$(cat /tmp/webhook-event-id.txt)"
          curl --fail --silent --show-error \
            -H 'X-ETS-Tenant: tenant_demo' \
            -H 'X-ETS-Workspace: workspace_alpha' \
            "http://localhost:8400/api/v1/events/${WEBHOOK_EVENT_ID}" > /tmp/restarted-webhook-event.json

          python - <<'PY'
          import json
          from pathlib import Path

          original_identity = json.loads(Path('/tmp/device-identity.json').read_text())
          restarted_identity = json.loads(Path('/tmp/restarted-device-identity.json').read_text())
          event = json.loads(Path('/tmp/restarted-event.json').read_text())
          webhook = json.loads(Path('/tmp/restarted-webhook-event.json').read_text())
          assert restarted_identity == original_identity, (original_identity, restarted_identity)
          assert event['event']['event_id'] == 'evt_edge_virtual_ci_001', event
          assert webhook['event']['event_type'] == 'evidence.captured.webhook', webhook
          PY

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f edge-demo/docker-compose.yml logs

      - name: Stop demo stack
        if: always()
        run: docker compose -f edge-demo/docker-compose.yml down -v
