name: ETS Committed Snapshot Checks

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '15 * * * *'
    - cron: '30 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ets-snapshot-hourly.yml'

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name != 'schedule' || vars.ETS_SNAPSHOT_HOURLY_PAUSED != 'true'
    name: Snapshot ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: ets-snapshot-${{ github.event_name }}-${{ github.ref }}-${{ matrix.suite }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        suite: >-
          ${{ fromJSON(github.event_name != 'schedule' && '["proof","storage","hosted","consumers"]'
            || github.event.schedule == '0 * * * *' && '["proof"]'
            || github.event.schedule == '15 * * * *' && '["storage"]'
            || github.event.schedule == '30 * * * *' && '["hosted"]'
            || '["consumers"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Test committed snapshot behavior
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            proof)
              tests=(tests/integration/test_api.py tests/unit/test_merkle.py
                     tests/unit/test_verifier_service.py tests/unit/test_tree_head_signing_envelope.py)
              ;;
            storage)
              tests=(tests/unit/test_azure_table_event_store.py tests/unit/test_azure_table_sdk_backend.py
                     tests/integration/test_api_security_persistence.py)
              ;;
            hosted)
              tests=(tests/integration/test_hosted_azure_env_composition.py
                     tests/test_hosted_evidence_create_capability.py
                     tests/integration/test_api_route_authorization.py)
              ;;
            consumers)
              tests=(tests/unit/test_sdk_contracts.py tests/test_gateway_core_relay_http.py
                     tests/unit/test_microsoft_soak_readiness_checker.py)
              ;;
            *) exit 2 ;;
          esac
          printf 'Suite `%s` tested commit `%s`.\n' "$SUITE" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          python -m pytest -q --junitxml="test-results/$SUITE.xml" "${tests[@]}"

      - name: Retain test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ets-snapshot-${{ matrix.suite }}
          path: test-results/${{ matrix.suite }}.xml
          if-no-files-found: warn
          retention-days: 7
