# one-shot readback trigger
name: Read Lantern Apex WWW Front Door State

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lantern-apex-www-state-readback.yml'

permissions:
  contents: read
  id-token: write

jobs:
  readback:
    name: Read apex and www Front Door state
    runs-on: ubuntu-latest
    environment: ets-azure-q1
    timeout-minutes: 8
    env:
      RESOURCE_GROUP: rg-ets-live-eastus
      PROFILE_NAME: lantern-continuity-fd
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Front Door CLI
        shell: bash
        run: az extension add --name cdn --upgrade --yes --only-show-errors
      - name: Read states
        shell: bash
        run: |
          set -euo pipefail
          for domain in lanternprotocol-net www-lanternprotocol-net; do
            az afd custom-domain show \
              -g "$RESOURCE_GROUP" \
              --profile-name "$PROFILE_NAME" \
              --custom-domain-name "$domain" \
              --query '{name:name,host:hostName,validation:domainValidationState,deployment:deploymentStatus,provisioning:provisioningState,token:validationProperties.validationToken,expiration:validationProperties.expirationDate,certificate:tlsSettings.certificateType}' \
              -o json
          done
