name: Live Microsoft RC1D Pre-Soak Reconciliation

on:
  workflow_dispatch:
    inputs:
      q0_workflow_run_id:
        description: Successful hosted Azure Q0 image workflow run ID
        required: true
        type: string
      rc1b_workflow_run_id:
        description: Successful RC1B live qualification workflow run ID
        required: true
        type: string
      rc1c_workflow_run_id:
        description: Successful RC1C subscription recovery workflow run ID
        required: true
        type: string
      gateway_fault_stage_workflow_run_id:
        description: Successful bounded Gateway relay fault-stage workflow run ID
        required: true
        type: string
      gateway_recovery_workflow_run_id:
        description: Successful protected Gateway relay/gap recovery workflow run ID
        required: true
        type: string
      gateway_state_workflow_run_id:
        description: Successful post-recovery hardened Gateway durable-state probe workflow run ID
        required: true
        type: string
      container_image:
        description: Exact private ACR image as registry/repository@sha256:<digest>
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: live-microsoft-rc1d-pre-soak-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile exact-source Microsoft P0 evidence
    runs-on: ubuntu-24.04
    environment: ets-azure-q1
    timeout-minutes: 15
    env:
      RESULT_ISSUE: '541'
      Q0_RUN_ID: ${{ inputs.q0_workflow_run_id }}
      RC1B_RUN_ID: ${{ inputs.rc1b_workflow_run_id }}
      RC1C_RUN_ID: ${{ inputs.rc1c_workflow_run_id }}
      GATEWAY_FAULT_STAGE_RUN_ID: ${{ inputs.gateway_fault_stage_workflow_run_id }}
      GATEWAY_RECOVERY_RUN_ID: ${{ inputs.gateway_recovery_workflow_run_id }}
      GATEWAY_STATE_RUN_ID: ${{ inputs.gateway_state_workflow_run_id }}
      CONTAINER_IMAGE: ${{ inputs.container_image }}
      ACR_NAME: etsq1a352eb89

    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert protected immutable boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import os
          import re

          for name in (
              "Q0_RUN_ID",
              "RC1B_RUN_ID",
              "RC1C_RUN_ID",
              "GATEWAY_FAULT_STAGE_RUN_ID",
              "GATEWAY_RECOVERY_RUN_ID",
              "GATEWAY_STATE_RUN_ID",
          ):
              if re.fullmatch(r"[1-9][0-9]*", os.environ[name]) is None:
                  raise SystemExit(name + " is not a canonical workflow run ID")
          image = os.environ["CONTAINER_IMAGE"]
          registry = re.escape(os.environ["ACR_NAME"] + ".azurecr.io")
          if re.fullmatch(rf"{registry}/[^@\s]+@sha256:[0-9a-f]{{64}}", image) is None:
              raise SystemExit("container_image is outside the exact private-ACR digest boundary")
          PY
          mkdir -p evidence/rc1d/{q0,rc1b,rc1c,gateway-fault-stage,gateway-recovery,gateway-state}

      - name: Validate source workflow run identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          validate_run() {
            run_id="$1"
            expected_path="$2"
            payload="$RUNNER_TEMP/run-${run_id}.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$payload"
            python - "$payload" "$expected_path" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "head_sha": os.environ["GITHUB_SHA"],
              "head_branch": "main",
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "path": sys.argv[2],
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f"source workflow run mismatch for {key}")
          PY
            rm -f "$payload"
          }
          validate_run "$Q0_RUN_ID" ".github/workflows/hosted-azure-q0-image.yml"
          validate_run "$RC1B_RUN_ID" ".github/workflows/live-microsoft-rc1b-preflight.yml"
          validate_run "$RC1C_RUN_ID" ".github/workflows/live-microsoft-rc1c-subscription-recovery.yml"
          validate_run "$GATEWAY_FAULT_STAGE_RUN_ID" ".github/workflows/live-sharepoint-relay-fault-stage.yml"
          validate_run "$GATEWAY_RECOVERY_RUN_ID" ".github/workflows/live-sharepoint-relay-recovery.yml"
          validate_run "$GATEWAY_STATE_RUN_ID" ".github/workflows/live-sharepoint-state-boundary-probe.yml"

      - name: Download exact Q0 evidence
        uses: actions/download-artifact@v8.0.1
        with:
          name: host-az-q0-image-${{ inputs.q0_workflow_run_id }}
          path: evidence/rc1d/q0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.q0_workflow_run_id }}

      - name: Download exact RC1B evidence
        uses: actions/download-artifact@v8.0.1
        with:
          name: live-microsoft-rc1b-preflight-${{ inputs.rc1b_workflow_run_id }}
          path: evidence/rc1d/rc1b
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rc1b_workflow_run_id }}

      - name: Download exact RC1C evidence
        uses: actions/download-artifact@v8.0.1
        with:
          name: live-microsoft-rc1c-subscription-recovery-${{ inputs.rc1c_workflow_run_id }}
          path: evidence/rc1d/rc1c
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rc1c_workflow_run_id }}

      - name: Download exact Gateway fault-stage evidence
        uses: actions/download-artifact@v8.0.1
        with:
          name: live-sharepoint-relay-fault-stage-${{ inputs.gateway_fault_stage_workflow_run_id }}
          path: evidence/rc1d/gateway-fault-stage
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.gateway_fault_stage_workflow_run_id }}

      - name: Download exact Gateway recovery evidence
        uses: actions/download-artifact@v8.0.1
        with:
          name: live-sharepoint-relay-recovery-${{ inputs.gateway_recovery_workflow_run_id }}
          path: evidence/rc1d/gateway-recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.gateway_recovery_workflow_run_id }}

      - name: Download exact post-recovery Gateway state evidence
        uses: actions/download-artifact@v8.0.1
        with:
          name: live-sharepoint-state-boundary-${{ inputs.gateway_state_workflow_run_id }}
          path: evidence/rc1d/gateway-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.gateway_state_workflow_run_id }}

      - name: Reconcile evidence and emit freeze-ready candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path: str) -> dict:
              target = Path(path)
              if not target.is_file():
                  raise SystemExit("required reconciliation evidence is missing: " + path)
              value = json.loads(target.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit("reconciliation evidence is not an object: " + path)
              return value

          def require_true(payload: dict, keys: tuple[str, ...], family: str) -> None:
              for key in keys:
                  if payload.get(key) is not True:
                      raise SystemExit(f"{family} predicate failed: {key}")

          def require_false(payload: dict, keys: tuple[str, ...], family: str) -> None:
              for key in keys:
                  if payload.get(key) is not False:
                      raise SystemExit(f"{family} fail-closed boundary failed: {key}")

          q0 = load("evidence/rc1d/q0/manifest.json")
          rc1b = load("evidence/rc1d/rc1b/result.json")
          rc1c = load("evidence/rc1d/rc1c/result.json")
          fault_stage = load("evidence/rc1d/gateway-fault-stage/result.json")
          recovery = load("evidence/rc1d/gateway-recovery/result.json")
          gateway = load("evidence/rc1d/gateway-state/result.json")

          source = os.environ["GITHUB_SHA"]
          image = os.environ["CONTAINER_IMAGE"]
          digest = image.rsplit("@", 1)[1]
          fault_stage_run = int(os.environ["GATEWAY_FAULT_STAGE_RUN_ID"])
          recovery_run = int(os.environ["GATEWAY_RECOVERY_RUN_ID"])
          state_run = int(os.environ["GATEWAY_STATE_RUN_ID"])

          if q0.get("schema_version") != "ets.host_az.q0_image.v1":
              raise SystemExit("Q0 manifest schema changed")
          if q0.get("source_sha") != source:
              raise SystemExit("Q0 source differs from the candidate source")
          if q0.get("immutable_image") != image or q0.get("image_digest") != digest:
              raise SystemExit("Q0 immutable image differs from the candidate image")
          if q0.get("vulnerability_gate") != "PASS" or q0.get("sbom") != "sbom.spdx.json":
              raise SystemExit("Q0 supply-chain gate is incomplete")
          require_false(q0, ("registry_credentials_retained", "customer_identifiers_retained"), "Q0")

          if rc1b.get("schema_version") != "ets.live_microsoft.rc1b_preflight_handoff.v2":
              raise SystemExit("RC1B handoff schema changed")
          if rc1b.get("source_sha") != source or rc1b.get("image_digest") != digest:
              raise SystemExit("RC1B evidence differs from the exact candidate")
          require_true(rc1b, (
              "preflight_passed", "rc1b_live_qualified", "fault_matrix_public_safe",
              "public_evidence_safe", "entra_users_checkpoint_progression",
              "entra_users_tombstone_verified", "entra_groups_checkpoint_progression",
              "entra_groups_tombstone_verified", "onedrive_checkpoint_progression",
              "onedrive_tombstone_verified", "entra_replay_idempotent",
              "onedrive_replay_idempotent", "graph_retry_after_verified",
              "throttle_checkpoint_withheld", "expired_cursor_gap_verified",
              "evidence_loss_checkpoint_withheld",
          ), "RC1B")
          require_false(rc1b, (
              "users_gap_open", "groups_gap_open", "raw_directory_payload_retained",
              "customer_identifiers_retained", "reusable_credential_retained",
              "soak_clock_started",
          ), "RC1B")

          if rc1c.get("schema_version") != "ets.live_microsoft.rc1c_subscription_recovery_handoff.v2":
              raise SystemExit("RC1C handoff schema changed")
          if rc1c.get("source_sha") != source or rc1c.get("image_digest") != digest:
              raise SystemExit("RC1C evidence differs from the exact candidate")
          require_true(rc1c, (
              "qualification_pass", "rc1c_live_qualified", "public_evidence_safe",
              "fault_matrix_public_safe", "cursor_replay_verified", "bounded_overlap_verified",
              "content_retrieval_verified", "canonicalization_deterministic",
              "throttle_retry_after_verified", "throttle_checkpoint_withheld",
              "gap_open_preserves_checkpoint", "intermediate_page_keeps_gap_open",
              "final_page_reconciles_gap", "evidence_loss_checkpoint_withheld",
              "revision_conflict_fail_closed", "restart_state_recovered",
              "purview_subscription_mutation_performed",
          ), "RC1C")
          require_false(rc1c, (
              "purview_webhook_configured", "graph_operation_performed",
              "graph_permission_mutation_performed", "graph_subscription_operation_performed",
              "raw_purview_payload_retained", "customer_identifiers_retained",
              "reusable_credential_retained", "soak_clock_started",
          ), "RC1C")
          if rc1c.get("subscription_final_state") != "enabled":
              raise SystemExit("RC1C subscription did not finish enabled")

          if fault_stage.get("schema_version") != "ets.live_sharepoint.relay_fault_stage.v1":
              raise SystemExit("Gateway fault-stage evidence schema changed")
          if fault_stage.get("workflow_run_id") != fault_stage_run:
              raise SystemExit("Gateway fault-stage workflow identity changed")
          if fault_stage.get("source_sha") != source or fault_stage.get("image_digest") != digest:
              raise SystemExit("Gateway fault-stage evidence differs from the exact candidate")
          require_true(fault_stage, (
              "checkpoint_present_before", "last_success_present_before", "observation_healthy_before",
              "stage_pass", "queue_state_mutated", "connector_runtime_mutated",
              "gap_open_after", "observation_collection_gap_after", "public_evidence_safe",
          ), "Gateway fault stage")
          require_false(fault_stage, (
              "gap_open_before", "lease_active_before", "lease_active_after", "core_state_mutated",
              "customer_identifiers_retained", "event_identifiers_retained", "event_hashes_retained",
              "core_payload_retained", "reusable_credential_retained",
              "m365_source_to_proof_claimed", "soak_clock_started",
          ), "Gateway fault stage")
          if fault_stage.get("queue_failures_before") != 0:
              raise SystemExit("Gateway fault stage did not start from a healthy queue")
          if fault_stage.get("core_present_match") != 1:
              raise SystemExit("Gateway fault stage did not prove the immutable Core marker copy")
          if fault_stage.get("terminal_total_after") != 1 or fault_stage.get("marker_terminal_after") != 1:
              raise SystemExit("Gateway fault stage did not isolate exactly one marker terminal row")
          if fault_stage.get("retryable_after") != 0:
              raise SystemExit("Gateway fault stage introduced retryable relay state")
          baseline_state_run = fault_stage.get("baseline_state_workflow_run_id")
          if not isinstance(baseline_state_run, int) or isinstance(baseline_state_run, bool) or baseline_state_run < 1:
              raise SystemExit("Gateway fault-stage baseline state run identity is invalid")

          if recovery.get("schema_version") != "ets.live_sharepoint.relay_recovery.v1":
              raise SystemExit("Gateway recovery evidence schema changed")
          if recovery.get("workflow_run_id") != recovery_run:
              raise SystemExit("Gateway recovery workflow identity changed")
          if recovery.get("source_sha") != source or recovery.get("image_digest") != digest:
              raise SystemExit("Gateway recovery evidence differs from the exact candidate")
          if recovery.get("fault_stage_workflow_run_id") != fault_stage_run:
              raise SystemExit("Gateway recovery is not bound to the supplied fault-stage run")
          require_true(recovery, (
              "checkpoint_present_after", "last_success_present_after", "gap_open_before",
              "observation_healthy_after", "upstream_healthy_after", "recovery_pass",
              "public_evidence_safe", "queue_state_mutated", "connector_runtime_mutated",
          ), "Gateway recovery")
          require_false(recovery, (
              "gap_open_after", "core_state_mutated", "customer_identifiers_retained",
              "event_identifiers_retained", "event_hashes_retained", "core_payload_retained",
              "reusable_credential_retained", "m365_source_to_proof_claimed", "soak_clock_started",
          ), "Gateway recovery")
          if recovery.get("terminal_total_before") != 1 or recovery.get("terminal_marker_count") != 1:
              raise SystemExit("Gateway recovery was outside the single staged marker boundary")
          if recovery.get("core_present_match") != 1 or recovery.get("queue_reconciled") != 1:
              raise SystemExit("Gateway recovery did not verify and reconcile exactly one staged marker")
          if recovery.get("marker_reconciled") != 1:
              raise SystemExit("Gateway recovery did not reconcile the staged marker")
          if recovery.get("queue_terminal_after") != 0 or recovery.get("queue_retryable_after") != 0:
              raise SystemExit("Gateway recovery left failed relay rows")

          if gateway.get("schema_version") != "ets.live_sharepoint.state_probe.v1":
              raise SystemExit("post-recovery Gateway state evidence schema changed")
          require_true(gateway, ("checkpoint_present", "last_success_present", "public_evidence_safe"), "post-recovery Gateway state")
          require_false(gateway, (
              "gap_open", "next_attempt_present", "lease_active", "customer_identifiers_retained",
              "reusable_credential_retained", "m365_source_to_proof_claimed", "soak_clock_started",
          ), "post-recovery Gateway state")
          if gateway.get("checkpoint_kind") != "delta" or gateway.get("observation_state") != "healthy_observation":
              raise SystemExit("post-recovery Gateway state is not a healthy terminal delta checkpoint")
          revision = gateway.get("checkpoint_revision")
          if not isinstance(revision, int) or isinstance(revision, bool) or revision < 1:
              raise SystemExit("post-recovery Gateway checkpoint revision is invalid")
          if gateway.get("retry_count") != 0:
              raise SystemExit("post-recovery Gateway retry state is not clear")
          if gateway.get("marker_local_event_count", 0) < 1 or gateway.get("marker_queue_synchronized", 0) < 1:
              raise SystemExit("post-recovery Gateway state did not observe synchronized marker evidence")
          for key in (
              "queue_pending", "queue_in_flight", "queue_retryable_failure", "queue_terminal_failure",
              "marker_queue_pending", "marker_queue_in_flight",
              "marker_queue_retryable_failure", "marker_queue_terminal_failure",
          ):
              if gateway.get(key) != 0:
                  raise SystemExit("post-recovery Gateway queue is not fully reconciled: " + key)

          if not (baseline_state_run < fault_stage_run < recovery_run < state_run):
              raise SystemExit("Gateway baseline -> fault stage -> recovery -> post-state run order is invalid")

          output = {
              "schema_version": "ets.live_microsoft.rc1d_pre_soak_candidate.v1",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "candidate_source_sha": source,
              "candidate_image": image,
              "candidate_image_digest": digest,
              "q0_workflow_run_id": int(os.environ["Q0_RUN_ID"]),
              "rc1b_workflow_run_id": int(os.environ["RC1B_RUN_ID"]),
              "rc1c_workflow_run_id": int(os.environ["RC1C_RUN_ID"]),
              "gateway_baseline_state_workflow_run_id": baseline_state_run,
              "gateway_fault_stage_workflow_run_id": fault_stage_run,
              "gateway_recovery_workflow_run_id": recovery_run,
              "gateway_state_workflow_run_id": state_run,
              "q0_vulnerability_gate_passed": True,
              "q0_sbom_retained": True,
              "q0_provenance_required": True,
              "rc1b_live_qualified": True,
              "rc1c_live_qualified": True,
              "gateway_fault_stage_verified": True,
              "gateway_recovery_verified": True,
              "gateway_durable_state_healthy": True,
              "graph_drive_subscriptions_deferred": True,
              "graph_subscription_configuration_absent": True,
              "graph_subscription_operation_performed": False,
              "public_gateway_callback_configured": False,
              "broader_graph_file_permission_claimed": False,
              "credential_retained": False,
              "customer_identifiers_retained": False,
              "public_evidence_safe": True,
              "pre_soak_reconciliation_passed": True,
              "freeze_ready": True,
              "candidate_frozen": False,
              "soak_clock_started": False,
          }
          Path("evidence/rc1d/reconciliation.json").write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload sanitized RC1D pre-soak reconciliation
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-microsoft-rc1d-pre-soak-reconciliation-${{ github.run_id }}
          path: evidence/rc1d/reconciliation.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish freeze-ready handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - > "$RUNNER_TEMP/rc1d-comment.md" <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("evidence/rc1d/reconciliation.json").read_text(encoding="utf-8"))
          print("### Microsoft RC1D pre-soak reconciliation")
          print()
          print(f"- workflow run: `{payload['workflow_run_id']}`")
          print(f"- candidate source: `{payload['candidate_source_sha']}`")
          print(f"- immutable image digest: `{payload['candidate_image_digest']}`")
          print("- Q0 vulnerability/SBOM/provenance boundary: **passed**")
          print("- RC1B live qualification and fault matrix: **passed**")
          print("- RC1C subscription recovery and polling matrix: **passed**")
          print("- Gateway healthy baseline: **passed**")
          print("- bounded synthetic Gateway relay fault stage: **passed**")
          print("- Gateway relay/gap recovery: **passed**")
          print("- post-recovery Gateway durable-state probe: **healthy and reconciled**")
          print("- Graph drive subscriptions: **deferred from P0**")
          print("- Graph subscription operation/public callback: **absent**")
          print("- reusable credentials/customer identifiers retained: **false**")
          print("- pre-soak reconciliation: **passed**")
          print("- freeze-ready: **true**")
          print("- candidate frozen: **false**")
          print("- 72-hour soak clock started: **false**")
          print()
          print("Next protected action: freeze this exact source/image pair, then launch a new governed 72-hour soak without changing source, image, identity, or configuration.")
          PY
          gh issue comment "$RESULT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/rc1d-comment.md"
          rm -f "$RUNNER_TEMP/rc1d-comment.md"
