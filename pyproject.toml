[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ets"
version = "0.1.0"
description = "Evidence Transparency System reference transparency log"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ETS Contributors" }]
dependencies = [
    "cryptography>=50.0.0,<51",
    "fastapi>=0.136,<0.137",
    "idna>=3.15,<4",
    "jinja2>=3.1,<4",
    "pydantic>=2.8,<3",
    "starlette>=1.3.1,<2",
]

[project.scripts]
ets-verify = "ets.verifier.cli:main"

[project.optional-dependencies]
dev = [
    "azure-identity>=1.17,<2",
    "click>=8.3.3,<9",
    "grpcio>=1.82.1,<2",
    "httpx>=0.28,<1",
    "msgpack>=1.2.1,<2",
    "opentelemetry-proto>=1.44,<2",
    "pip-audit>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pytest>=9.0.3,<10",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-grpcio>=1.83.0.20260730,<2",
    "types-protobuf>=7.34.1.20260518,<8",
    "uvicorn>=0.47,<1",
]
edge = [
    "httpx>=0.28,<1",
    "uvicorn>=0.32,<1",
]
gateway = [
    "boto3>=1.34,<2",
    "grpcio>=1.82.1,<2",
    "opentelemetry-proto>=1.44,<2",
    "uvicorn>=0.47,<1",
]
azure = [
    "azure-data-tables>=12,<13",
    "azure-identity>=1.17,<2",
    "azure-keyvault-keys>=4.9,<5",
]
fleet = [
    "azure-identity>=1.17,<2",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.47,<1",
]
hosted = [
    "azure-data-tables>=12,<13",
    "azure-identity>=1.17,<2",
    "azure-keyvault-keys>=4.9,<5",
    "uvicorn>=0.47,<1",
]

[tool.setuptools.packages.find]
include = ["ets*"]
exclude = ["ets.core.ets_core*"]

[tool.setuptools.package-data]
ets = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ets"]
